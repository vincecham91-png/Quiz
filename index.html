}

// ============ SECTION 7: BATTLE LOGIC ============
function startBattleRound() {
    battleState.buzzerWinner = null;
    battleState.secondChance = false;
    battleState.roundResolved = false;
    battleState.shieldBlocked = false;
    battleState.timerPhase = 'waiting';
    battleState.timerActiveSide = null;

    // Reset per-round lock state
    buzzerFailedLeft = false;
    buzzerFailedRight = false;
    pausedTimerRemaining = 0;
    turnOverlayActive = false;
    leftFallen = false;
    rightFallen = false;
    // Reset per-round skill flags
    skillState.leftReviveUsedThisRound = false;
    skillState.rightReviveUsedThisRound = false;
    skillState.leftFreezeBonus = 0;
    skillState.rightFreezeBonus = 0;
    skillState.showFreezeOverlay = false;
    skillState.freezeOverlaySide = null;
    setSingleBuzzerEnabled('left', true);
    setSingleBuzzerEnabled('right', true);

    document.getElementById('battle-view').classList.remove('hidden');
    document.getElementById('battle-note').classList.add('hidden');

    const leftName = battleState.leftStudent || '宸﹀疂鍙ⅵ';
    const rightName = battleState.rightStudent || '鍙冲疂鍙ⅵ';
    // 澶╀笅鍏晫鐨勭帇鑰呭悕瀛楁梺鏄剧ず 馃憫
    var kingCrown = function(n) { return (publicEnemyState.active && publicEnemyState.kingPlayer === n) ? ' 馃憫' : ''; };
    document.getElementById('buzzer-left-name').innerText = leftName + kingCrown(leftName);
    document.getElementById('buzzer-right-name').innerText = rightName + kingCrown(rightName);
    document.getElementById('timer-label').innerText = '鈴憋笍 鎶㈢瓟鍊掕鏃?;

    if (students[leftName]) battleState.leftLevel = students[leftName].level || 1;
    if (students[rightName]) battleState.rightLevel = students[rightName].level || 1;

    resizeCanvas();
    startRenderLoop();

    if (battleState.questionIndex >= scenes.length) {
        stopRenderLoop();
        document.getElementById('battle-view').classList.add('hidden');
        showLeaderboard();
        return;
    }
    const q = scenes[battleState.questionIndex];
    const questionEl = document.getElementById('battle-question');
    questionEl.replaceChildren();
    const questionMeta = document.createElement('span');
    questionMeta.style.fontSize = '1rem';
    questionMeta.style.opacity = '0.5';
    questionMeta.textContent = (q.diff || '') + ' ' + (q.emoji || '');
    questionEl.append(questionMeta, document.createElement('br'), document.createTextNode(q.q || ''));
    renderBattleOptions(q.options);

    setOptionsEnabled(false);
    setBuzzersEnabled(true);
    document.getElementById('buzzer-left-btn').classList.remove('active-buzz');
    document.getElementById('buzzer-right-btn').classList.remove('active-buzz');
    document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('correct-answer','wrong-choice'));

    if (config.timerEnabled) startBattleTimer(config.timerSeconds, 'waiting');

    // Preemptive strike: auto-buzz for player with this skill
    if (skillState.leftSkill === 'preemptive' && !skillState.leftSkillConsumed) {
        skillState.leftSkill = null; skillState.leftSkillConsumed = true;
        setTimeout(function() { handleBuzzer('left'); }, 600);
    } else if (skillState.rightSkill === 'preemptive' && !skillState.rightSkillConsumed) {
        skillState.rightSkill = null; skillState.rightSkillConsumed = true;
        setTimeout(function() { handleBuzzer('right'); }, 600);
    }

    if (battleState.questionIndex === 0) speak('绗竴棰橈紒' + q.q);
    else speak(q.q);
}

function renderBattleOptions(options) {
    const container = document.getElementById('battle-options');
    container.innerHTML = '';
    options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        const optionNumber = document.createElement('span');
        optionNumber.style.fontWeight = '900';
        optionNumber.style.marginRight = '10px';
        optionNumber.textContent = (i + 1) + '.';
        btn.append(optionNumber, document.createTextNode(' ' + (opt || '')));
        btn.id = 'battle-opt-' + i;
        btn.disabled = true;
        btn.onclick = function() { handleAnswerChoice(i); };
        container.appendChild(btn);
    });
}

function setOptionsEnabled(en) {
    document.querySelectorAll('.option-btn').forEach(function(b) { b.disabled = !en; });
}

function setBuzzersEnabled(en) {
    document.getElementById('buzzer-left-btn').disabled = !en;
    document.getElementById('buzzer-right-btn').disabled = !en;
}

function setSingleBuzzerEnabled(side, enabled) {
    var btn = document.getElementById(side === 'left' ? 'buzzer-left-btn' : 'buzzer-right-btn');
    btn.disabled = !enabled;
    if (!enabled) { btn.style.opacity = '0.3'; btn.style.cursor = 'not-allowed'; }
    else { btn.style.opacity = '1'; btn.style.cursor = 'pointer'; }
}

function showTurnOverlay(name) {
    turnOverlayActive = true;
    document.getElementById('turn-overlay-name').textContent = '杞埌 ' + name + ' 浣滅瓟锛?;
    document.getElementById('turn-overlay').style.display = 'flex';
    speak(name + '锛岃疆鍒颁綘浣滅瓟锛?);
}

function dismissTurnOverlay() {
    if (!turnOverlayActive) return;
    turnOverlayActive = false;
    document.getElementById('turn-overlay').style.display = 'none';
    setOptionsEnabled(true);
    // Apply time freeze bonus if active
    var side = battleState.buzzerWinner;
    var bonus = skillState[side + 'FreezeBonus'] || 0;
    var totalTime = config.answerSeconds + bonus;
    startBattleTimer(totalTime, 'answering', side);
    skillState[side + 'FreezeBonus'] = 0;
    var buzzerName = side === 'left' ? battleState.leftStudent : battleState.rightStudent;
    document.getElementById('timer-label').innerText = (bonus > 0 ? '鉂勶笍 ' : '鈿?') + buzzerName + ' 浣滅瓟涓?..';
    speak(buzzerName + '锛岃浣滅瓟锛?);
}

function handleBuzzer(side) {
    if (battleState.buzzerWinner !== null) return;
    if (battleState.roundResolved) return;
    if (battleState.timerPhase !== 'waiting') return;
    if (side === 'left' && buzzerFailedLeft) return;
    if (side === 'right' && buzzerFailedRight) return;

    battleState.buzzerWinner = side;
    playBuzzerSound();
    pausedTimerRemaining = battleState.timerRemaining;
    stopBattleTimer();
    setBuzzersEnabled(false);

    // Time Freeze skill: grant +5 seconds answer time
    if (skillState[side + 'Skill'] === 'time_freeze' && !skillState[side + 'SkillConsumed']) {
        skillState[side + 'FreezeBonus'] = 5;
        skillState[side + 'Skill'] = null;
        skillState[side + 'SkillConsumed'] = true;
        // Brief freeze overlay effect
        skillState.showFreezeOverlay = true;
        skillState.freezeOverlaySide = side;
        setTimeout(function() { skillState.showFreezeOverlay = false; }, 1500);
        playSynth(200, 'sine', 0.08, 0.6); // wind/whoosh sound
        speak('鏃剁┖鍐荤粨锛侀澶栦簲绉掞紒');
    }

    var btnId = side === 'left' ? 'buzzer-left-btn' : 'buzzer-right-btn';
    document.getElementById(btnId).classList.add('active-buzz');

    battleState.timerPhase = 'answering';
    battleState.timerActiveSide = side;

    var name = side === 'left' ? battleState.leftStudent : battleState.rightStudent;
    showTurnOverlay(name);
}

function handleAnswerChoice(optIdx) {
    if (battleState.buzzerWinner === null) return;
    if (battleState.roundResolved) return;
    if (battleState.timerPhase !== 'answering') return;

    stopBattleTimer();
    var q = scenes[battleState.questionIndex];
    var isCorrect = (optIdx === q.ans);
    var answeringSide = battleState.buzzerWinner;
    var opponentSide = answeringSide === 'left' ? 'right' : 'left';

    if (isCorrect) {
        // First student correct 鈫?reveal answer + resolve
        document.querySelectorAll('.option-btn').forEach(function(b, i) {
            if (i === q.ans) b.classList.add('correct-answer');
        });
        resolveRound('correct', answeringSide);
    } else if (battleState.secondChance) {
        // Both tried 鈫?reveal correct answer + both lose
        document.querySelectorAll('.option-btn').forEach(function(b, i) {
            if (i === q.ans) b.classList.add('correct-answer');
            if (i === optIdx) b.classList.add('wrong-choice');
        });
        resolveRound('both_lose');
    } else {
        // Revive skill check: re-answer instead of passing to opponent
        var reviveKey = answeringSide + 'ReviveUsedThisRound';
        if (skillState[answeringSide + 'Skill'] === 'revive' && !skillState[answeringSide + 'SkillConsumed'] && !skillState[reviveKey]) {
            skillState[answeringSide + 'Skill'] = null;
            skillState[answeringSide + 'SkillConsumed'] = true;
            skillState[reviveKey] = true;
            // Clear wrong highlight
            document.querySelectorAll('.option-btn').forEach(function(b, i) {
                if (i === optIdx) b.classList.remove('wrong-choice');
            });
            // Revive sparkle animation
            addReviveAnimation(answeringSide);
            playSynth(523, 'sine', 0.1, 0.15);
            setTimeout(function() { playSynth(659, 'sine', 0.1, 0.15); }, 150);
            setTimeout(function() { playSynth(784, 'sine', 0.1, 0.2); }, 300);
            // Restart answer timer
            startBattleTimer(config.answerSeconds, 'answering', answeringSide);
            document.getElementById('timer-label').innerText = '馃挌 澶嶆椿锛佸啀璇曚竴娆?;
            speak('澶嶆椿锛佸啀璇曚竴娆★紒');
            return;
        }

        // First student wrong 鈫?mark wrong, lock their buzzer, resume main timer for opponent
        document.querySelectorAll('.option-btn').forEach(function(b, i) {
            if (i === optIdx) b.classList.add('wrong-choice');
        });
        battleState.secondChance = true;
        playWrongSound();

        // Lock the failed student's buzzer
        if (answeringSide === 'left') buzzerFailedLeft = true;
        else buzzerFailedRight = true;
        setSingleBuzzerEnabled(answeringSide, false);
        var failedNameEl = document.getElementById(answeringSide === 'left' ? 'buzzer-left-name' : 'buzzer-right-name');
        failedNameEl.textContent = '鉂?' + (answeringSide === 'left' ? battleState.leftStudent : battleState.rightStudent) + '锛堝凡绛旈敊锛?;
        document.getElementById(answeringSide === 'left' ? 'buzzer-left-btn' : 'buzzer-right-btn').classList.remove('active-buzz');

        battleState.buzzerWinner = null;
        battleState.timerPhase = 'waiting';
        battleState.timerActiveSide = null;
        setOptionsEnabled(false);

        var oppName = opponentSide === 'left' ? battleState.leftStudent : battleState.rightStudent;
        setTimeout(function() {
            // Clear the wrong-choice highlight so second student sees clean options
            document.querySelectorAll('.option-btn').forEach(function(b) { b.classList.remove('wrong-choice'); });
            // Re-enable opponent's buzzer and resume main countdown
            setSingleBuzzerEnabled(opponentSide, true);
            if (config.timerEnabled) {
                document.getElementById('timer-label').innerText = '鈴憋笍 鎶㈢瓟鍊掕鏃?;
                startBattleTimer(pausedTimerRemaining, 'waiting');
            } else {
                document.getElementById('timer-label').innerText = '鈴憋笍 鎶㈢瓟锛堜笉闄愭椂锛?;
            }
            speak(oppName + '锛岃疆鍒颁綘浜嗭紒');
        }, 800);
    }
}

function resolveRound(result, winningSide) {
    battleState.roundResolved = true;
    battleState.timerPhase = 'done';
    stopBattleTimer();
    setBuzzersEnabled(false);
    setOptionsEnabled(false);

    var q = scenes[battleState.questionIndex];
    document.querySelectorAll('.option-btn').forEach(function(b, i) {
        b.disabled = true;
        if (i === q.ans) b.classList.add('correct-answer');
    });

    var leftName = battleState.leftStudent, rightName = battleState.rightStudent;
    var leftChar = battleState.leftCharacter, rightChar = battleState.rightCharacter;

    if (result === 'correct' && winningSide) {
        var winnerName = winningSide === 'left' ? leftName : rightName;
        var loserName = winningSide === 'left' ? rightName : leftName;
        var winnerChar = winningSide === 'left' ? leftChar : rightChar;
        var loserChar = winningSide === 'left' ? rightChar : leftChar;
        var loserSide = winningSide === 'left' ? 'right' : 'left';

        // Shield skill check: block the attack
        if (skillState[loserSide + 'Skill'] === 'shield' && !skillState[loserSide + 'SkillConsumed']) {
            skillState[loserSide + 'Skill'] = null;
            skillState[loserSide + 'SkillConsumed'] = true;
            // Shield block animation
            addShieldBlockAnimation(loserSide);
            playSynth(200, 'square', 0.08, 0.2);
            setTimeout(function() { playSynth(100, 'triangle', 0.1, 0.25); }, 150);
            // Show note directly (shield blocked, no scores change)
            setTimeout(function() {
                document.getElementById('battle-note').classList.remove('hidden');
                document.getElementById('battle-note-text').innerText = '馃洝锔?' + loserName + ' 鐨勬姢鐩炬尅浣忎簡鏀诲嚮锛佸弻鏂规湭寰楀垎銆俓n\n' + (q.note || '');
                document.getElementById('timer-label').innerText = '馃洝锔?鎶ょ浘鏍兼尅锛?;
                var nextBtn = document.getElementById('next-round-btn-text');
                if (battleState.questionIndex + 1 >= scenes.length) {
    nextBtn.innerText = '馃弳 鏌ョ湅鏈€缁堝疂鍙ⅵ姒?鈫?;
                } else {
                    nextBtn.innerText = '涓嬩竴鍦哄鍐?鈫?;
                }
            }, 800);
            speak('鎶ょ浘鎸′綇浜嗘敾鍑伙紒');
            // Still mark both as answered the question
            if (students[winnerName]) { students[winnerName].totalQuestions++; }
            if (students[loserName]) { students[loserName].totalQuestions++; }
            // Mark shield blocked so proceedAfterRound keeps both players
            battleState.shieldBlocked = true;
            return;
        }

        // Ensure both students exist in tracking (replacement students may not be)
        if (!students[winnerName]) {
            students[winnerName] = { name: winnerName, wins: 0, losses: 0, streak: 0, bestStreak: 0, character: null, level: 1, eliminated: false, usedCount: 0, totalQuestions: 0, correctAnswers: 0 };
        }
        if (!students[loserName]) {
            students[loserName] = { name: loserName, wins: 0, losses: 0, streak: 0, bestStreak: 0, character: null, level: 1, eliminated: false, usedCount: 0, totalQuestions: 0, correctAnswers: 0 };
        }

        // Capture loser's streak before reset (for King Slayer check)
        var loserStreakBefore = students[loserName] ? students[loserName].streak : 0;
        var winsBefore = students[winnerName].wins;

        students[winnerName].wins++;
        // Double score skill: extra win
        var dblKey = winningSide + 'DoubleScore';
        var doubleScoreUsed = false;
        if (skillState[dblKey]) {
            students[winnerName].wins++;
            skillState[dblKey] = false;
            skillState[winningSide + 'Skill'] = null;
            skillState[winningSide + 'SkillConsumed'] = true;
            doubleScoreUsed = true;
        }
        // King Slayer: +1 extra win + bonus streak if beating a 3+ streak opponent
        // Only add win if double_score didn't already boost (cap at +2 total)
        if (loserStreakBefore >= 3 && !doubleScoreUsed) {
            students[winnerName].wins++;
        }
        if (loserStreakBefore >= 3) {
            students[winnerName].streak++;  // bonus streak: beating the king counts as "extra round"
            addKingSlayerAnimation();
            playKingSlayerSound();
        }
        students[winnerName].streak++;  // regular +1 streak per round
        students[winnerName].correctAnswers++;
        students[winnerName].totalQuestions++;
        students[winnerName].character = winnerChar;
        students[winnerName].eliminated = false; // Winner stays alive
        if (students[winnerName].streak > students[winnerName].bestStreak) students[winnerName].bestStreak = students[winnerName].streak;
        checkLevelUp(winnerName);

        // Always update loser stats (MUST run before skill wheel check)
        students[loserName].losses++;
        students[loserName].streak = 0;
        students[loserName].level = 1;
        students[loserName].totalQuestions++;
        students[loserName].eliminated = true;
        students[loserName].character = loserChar;
        // Clear loser's skill on defeat (always reset consumed flag too)
        if (skillState[loserSide + 'Skill']) {
            skillState[loserSide + 'Skill'] = null;
        }
        skillState[loserSide + 'SkillConsumed'] = false;
        skillState[loserSide + 'DoubleScore'] = false;
        skillState[loserSide + 'LastSkillStreak'] = 0;  // reset on loss

        // Update group stats (group mode)
        if (gameMode === 'group' && groups.length > 0) {
            var wGid = winningSide === 'left' ? groupWheelState.leftGroupIdx : groupWheelState.rightGroupIdx;
            var lGid = winningSide === 'left' ? groupWheelState.rightGroupIdx : groupWheelState.leftGroupIdx;
            if (wGid !== null && wGid !== undefined && groups[wGid]) groups[wGid].totalWins += (students[winnerName].wins - winsBefore);
            // Mark loser player as eliminated in group
            if (lGid !== null && lGid !== undefined && groups[lGid]) {
                groups[lGid].players.forEach(function(p) {
                    if (p.name === loserName) p.eliminated = true;
                });
            }
        }

        // ===== 澶╀笅鍏晫锛堜袱绉嶆ā寮忓叡鐢級=====
        // 鈶?鐜嬭€呮檵鍗囷細瀹堟搨鐜╁杩炶儨鈮? 涓斿綋鍓嶄笉鍦ㄥぉ涓嬪叕鏁岀姸鎬?鈫?瑙﹀彂
        if (!publicEnemyState.active && students[winnerName].streak >= 5) {
            publicEnemyState.active = true;
            publicEnemyState.kingGroupIdx = (gameMode === 'group') ? wGid : null;
            publicEnemyState.kingPlayer = winnerName;
            publicEnemyState.kingStreak = students[winnerName].streak;
            if (gameMode === 'group') {
                showBigPopup('馃憫', '澶╀笅鍏晫锛?,
                    [winnerName + ' 杩炶儨' + students[winnerName].streak + '鍦猴紝鏅嬪崌鐜嬭€咃紒', '鎵撹触鐜嬭€咃紝鍏ㄤ綋鍓╀綑缁勫埆鍚?+2 鍒嗭紒'],
                    winnerName + '杩炶儨' + students[winnerName].streak + '鍦猴紝鏅嬪崌鐜嬭€咃紒澶╀笅鍏晫鍚姩锛佹墦璐ョ帇鑰咃紝鍏ㄤ綋鍓╀綑缁勫埆鍚勫姞2鍒嗭紒');
            } else {
                showBigPopup('馃憫', '澶╀笅鍏晫锛?,
                    [winnerName + ' 杩炶儨' + students[winnerName].streak + '鍦猴紝鏅嬪崌鐜嬭€咃紒', '鎵撹触鐜嬭€咃紝璁ㄤ紣鑰?+2 鍒嗭紝鍏ㄤ綋瀛樻椿鍚?+1 鍒嗭紒'],
                    winnerName + '杩炶儨' + students[winnerName].streak + '鍦猴紝鏅嬪崌鐜嬭€咃紒澶╀笅鍏晫鍚姩锛佹墦璐ョ帇鑰咃紝璁ㄤ紣鑰呭姞2鍒嗭紝鍏ㄤ綋瀛樻椿鍚勫姞1鍒嗭紒');
            }
        }
        // 鈶?璁ㄤ紣鎴愬姛锛氱帇鑰呮湰浜鸿鍑昏触 鈫?鎸夋ā寮忓彂濂栵紝澶╀笅鍏晫瑙ｉ櫎
        if (publicEnemyState.active && loserName === publicEnemyState.kingPlayer) {
            var slayedKing = publicEnemyState.kingPlayer;
            if (gameMode === 'group') {
                groups.forEach(function(g, gid) {
                    if (gid === publicEnemyState.kingGroupIdx) return;
                    if (g.aliveCount > 0) g.totalWins += 2;
                });
                showBigPopup('鈿旓笍', '璁ㄤ紣鎴愬姛锛?,
                    [winnerName + ' 鍑昏触浜嗙帇鑰?' + slayedKing + '锛?, '鍏ㄤ綋鍓╀綑缁勫埆鍚?+2 鍒嗭紒'],
                    winnerName + '鍑昏触浜嗗ぉ涓嬪叕鏁岋紒鍏ㄤ綋鍓╀綑缁勫埆鍚勫姞2鍒嗭紒');
            } else {
                // 鍙屼汉鍐虫垬锛氳浼愯€?+2锛屽叏浣撳叾浠栧瓨娲诲鐢熷悇 +1锛堣浼愯€呬笉鍙犲姞锛涚帇鑰呭凡娣樻卑鑷劧涓嶅惈锛?
                students[winnerName].wins += 2;
                Object.keys(students).forEach(function(n) {
                    if (n === winnerName) return;
                    if (n === publicEnemyState.kingPlayer) return;
                    if (students[n] && !students[n].eliminated) students[n].wins += 1;
                });
                showBigPopup('鈿旓笍', '璁ㄤ紣鎴愬姛锛?,
                    [winnerName + ' 鍑昏触浜嗙帇鑰?' + slayedKing + '锛?, '璁ㄤ紣鑰?+2 鍒嗭紝鍏ㄤ綋瀛樻椿鍚?+1 鍒嗭紒'],
                    winnerName + '鍑昏触浜嗗ぉ涓嬪叕鏁岋紒璁ㄤ紣鑰呭姞2鍒嗭紝鍏ㄤ綋瀛樻椿鍚勫姞1鍒嗭紒');
            }
            // 璁ㄤ紣鑰呰繛鑳滃悓姝?+2锛氭墦璐ョ帇鑰呬竴娆℃嬁 4 鍒嗭紝浣嗚繛鑳滃彧 +2 杈句笉鍒板ぇ鎷?3杩炶儨)/King Slayer(3+杩炶儨)闃堝€硷紝
            // 瀵艰嚧鍚庣画瀛︾敓鏃㈡嬁涓嶅埌澶ф嫑銆佷篃瑙﹀彂涓嶄簡 King Slayer銆傝繖閲岃杩炶儨涓庛€?4 鍒嗐€嶅榻愩€?
            students[winnerName].streak += 2;
            if (students[winnerName].streak > students[winnerName].bestStreak) students[winnerName].bestStreak = students[winnerName].streak;
            // 闈欓粯鏇存柊绛夌骇锛堣浼愰澶栬繛鑳滀笉閲嶅鎾斁鍗囩骇闊虫晥/鐗规晥锛宑heckLevelUp 宸插湪涓婇潰璋冪敤杩囷級
            var _lv = students[winnerName].streak >= 3 ? 3 : (students[winnerName].streak >= 2 ? 2 : 1);
            if (_lv > students[winnerName].level) students[winnerName].level = _lv;

            publicEnemyState.active = false;
            publicEnemyState.kingGroupIdx = null;
            publicEnemyState.kingPlayer = null;
            publicEnemyState.kingStreak = 0;
        }

        // Play animations and sounds
        playCorrectSound();
        // The skill flag is cleared once its bonus win is awarded above, so use the
        // captured result to keep the giant-weapon animation in sync with scoring.
        addAttackAnimation(winningSide, winnerChar, doubleScoreUsed);
        setTimeout(function() {
            addFallAnimation(loserSide, loserChar, winningSide === 'left' ? battleState.rightLevel : battleState.leftLevel);
        }, 700);

        // Skill wheel trigger: every 3 consecutive wins (streak 3, 6, 9, ...)
        var winnerStreak = students[winnerName] ? students[winnerName].streak : 0;
        var winnerSkillSlot = winningSide + 'Skill';
        var winsSinceLastSkill = winnerStreak - (skillState[winningSide + 'LastSkillStreak'] || 0);
        if (winsSinceLastSkill >= 3 && !skillState[winnerSkillSlot]) {
            // Delay note 鈥?show skill wheel first
            setTimeout(function() {
                showSkillWheel(winningSide, winnerName);
            }, 1500);
            return; // Note will be shown by closeSkillWheel()
        }

    } else if (result === 'both_lose') {
        // Ensure both students exist in tracking
        if (!students[leftName]) {
            students[leftName] = { name: leftName, wins: 0, losses: 0, streak: 0, bestStreak: 0, character: null, level: 1, eliminated: false, usedCount: 0, totalQuestions: 0, correctAnswers: 0 };
        }
        if (!students[rightName]) {
            students[rightName] = { name: rightName, wins: 0, losses: 0, streak: 0, bestStreak: 0, character: null, level: 1, eliminated: false, usedCount: 0, totalQuestions: 0, correctAnswers: 0 };
        }
        students[leftName].losses++; students[leftName].streak = 0; students[leftName].level = 1; students[leftName].totalQuestions++;
        students[leftName].eliminated = true; students[leftName].character = leftChar;
        students[rightName].losses++; students[rightName].streak = 0; students[rightName].level = 1; students[rightName].totalQuestions++;
        students[rightName].eliminated = true; students[rightName].character = rightChar;
        // Clear skills for both sides
        skillState.leftSkill = null; skillState.leftSkillConsumed = false;
        skillState.rightSkill = null; skillState.rightSkillConsumed = false;
        skillState.leftDoubleScore = false; skillState.rightDoubleScore = false;
        skillState.leftLastSkillStreak = 0; skillState.rightLastSkillStreak = 0;

        // Update group stats: both players eliminated
        if (gameMode === 'group' && groups.length > 0) {
            [groupWheelState.leftGroupIdx, groupWheelState.rightGroupIdx].forEach(function(gid) {
                if (gid !== null && gid !== undefined && groups[gid]) {
                    groups[gid].players.forEach(function(p) {
                        if (p.name === leftName || p.name === rightName) p.eliminated = true;
                    });
                }
            });
        }

        playWrongSound();
        addFallAnimation('left', leftChar, battleState.leftLevel);
        setTimeout(function() { addFallAnimation('right', rightChar, battleState.rightLevel); }, 300);
    }

    // Only show note if skill wheel wasn't triggered
    if (!skillWheelState.pendingSide) {
        setTimeout(function() {
            document.getElementById('battle-note').classList.remove('hidden');
            var noteText = q.note || '';
            // 涓嶅啀鍦ㄧ煡璇嗘€荤粨涓樉绀猴紝寮圭獥宸插崟鐙彁閱?
            document.getElementById('battle-note-text').innerText = noteText;
            document.getElementById('timer-label').innerText = '鉁?鍥炲悎缁撴潫';
            var nextBtn = document.getElementById('next-round-btn-text');
            if (battleState.questionIndex + 1 >= scenes.length) {
nextBtn.innerText = '馃弳 鏌ョ湅鏈€缁堝疂鍙ⅵ姒?鈫?;
            } else {
                nextBtn.innerText = '涓嬩竴鍦哄鍐?鈫?;
            }
        }, 1500);
    }
}

function proceedAfterRound() {
    if (gameMode === 'group') { groupProceedAfterRound(); return; }
    document.getElementById('battle-note').classList.add('hidden');
    battleState.questionIndex++;

    if (battleState.questionIndex >= scenes.length) {
        stopRenderLoop();
        document.getElementById('battle-view').classList.add('hidden');
        showLeaderboard();
        return;
    }

    // 澶╀笅鍏晫锛堝弻浜哄喅鎴橈級锛氱帇鑰呭凡琚窐姹帮紙濡傚弻鏂硅秴鏃堕兘绠楄緭锛夆啋 瑙ｉ櫎
    if (publicEnemyState.active && students[publicEnemyState.kingPlayer] && students[publicEnemyState.kingPlayer].eliminated) {
        publicEnemyState.active = false;
        publicEnemyState.kingGroupIdx = null;
        publicEnemyState.kingPlayer = null;
        publicEnemyState.kingStreak = 0;
    }
    // 澶╀笅鍏晫鐢熸晥涓細璺宠繃杞洏锛岃繘鍏ャ€岃皝鎰挎寫鎴樼帇鑰咃紵銆嶆姤鍚嶅埗
    if (publicEnemyState.active) {
        showPublicEnemyDuelSignup();
        return;
    }

    var leftName = battleState.leftStudent, rightName = battleState.rightStudent;
    var leftAlive = students[leftName] && !students[leftName].eliminated;
    var rightAlive = students[rightName] && !students[rightName].eliminated;
    var leftOnStage = leftAlive;
    var rightOnStage = rightAlive;

    stopRenderLoop();

    if (leftOnStage && !rightOnStage) {
        battleState.leftStudent = leftName;
        battleState.leftCharacter = (students[leftName] && students[leftName].character) || battleState.leftCharacter;
        battleState.leftLevel = (students[leftName] && students[leftName].level) || 1;
        spinForSlot('right');
    } else if (!leftOnStage && rightOnStage) {
        battleState.rightStudent = rightName;
        battleState.rightCharacter = (students[rightName] && students[rightName].character) || battleState.rightCharacter;
        battleState.rightLevel = (students[rightName] && students[rightName].level) || 1;
        spinForSlot('left');
    } else if (leftAlive && rightAlive && battleState.shieldBlocked) {
        // Shield block: both survive, continue with same characters
        battleState.shieldBlocked = false;
        battleState.leftStudent = leftName;
        battleState.rightStudent = rightName;
        battleState.leftCharacter = (students[leftName] && students[leftName].character) || battleState.leftCharacter;
        battleState.leftLevel = (students[leftName] && students[leftName].level) || 1;
        battleState.rightCharacter = (students[rightName] && students[rightName].character) || battleState.rightCharacter;
        battleState.rightLevel = (students[rightName] && students[rightName].level) || 1;
        document.getElementById('battle-view').classList.add('hidden');
        showVSCountdown();
    } else {
        spinForBoth();
    }
}

function spinForSlot(slot) {
    var winnerName = slot === 'left' ? battleState.rightStudent : battleState.leftStudent;
    // 娌℃湁鍙寫鎴樼殑瀵规墜锛堥櫎鍐犲啗澶栨棤鏈窐姹板鐢燂級鈫?鐩存帴杩涘叆鎬荤粨锛屼笉鍐嶅娲诲凡娣樻卑瀛︾敓
    var uneliminated = Object.keys(students).filter(function(n) { return !students[n].eliminated; });
    var available = uneliminated.filter(function(n) { return n !== winnerName; });
    if (available.length < 1) {
        endGameEarly();
        return;
    }
    document.getElementById('battle-view').classList.add('hidden');
    document.getElementById('wheel-view').classList.remove('hidden');
    document.getElementById('wheel-label').innerText = slot === 'left' ? '馃敶 宸︽柟鏂板疂鍙ⅵ鎶介€変腑...' : '馃數 鍙虫柟鏂板疂鍙ⅵ鎶介€変腑...';
    document.getElementById('wheel-result').classList.add('hidden');
    document.getElementById('wheel-result-actions').classList.add('hidden');
    document.getElementById('confirm-student-btn').classList.add('hidden');
    document.getElementById('skip-student-btn').classList.add('hidden');
    clearTimeout(wheelTimeout);
    wheelState.spinCount = 1; // Single spin
    wheelState._spinForSlot = slot;
    wheelState.excludeStudent = winnerName; // Exclude winner from wheel
    // Reset new challenger's skill slot
    if (slot === 'left') {
        skillState.leftSkill = null; skillState.leftSkillConsumed = false; skillState.leftDoubleScore = false;
        skillState.leftLastSkillStreak = 0;
    } else {
        skillState.rightSkill = null; skillState.rightSkillConsumed = false; skillState.rightDoubleScore = false;
        skillState.rightLastSkillStreak = 0;
    }

    var avail = getWheelCandidateNames();
    initWheel(avail);
    document.getElementById('spin-btn').classList.remove('hidden');
    setSpinBtnEnabled(true);

    var origComplete = onWheelComplete;
    onWheelComplete = function(name) {
        playCorrectSound();
        // Ensure replacement student exists in tracking
        if (!students[name]) {
            students[name] = { name: name, wins: 0, losses: 0, streak: 0, bestStreak: 0, character: null, level: 1, eliminated: false, usedCount: 1, totalQuestions: 0, correctAnswers: 0 };
        } else {
            students[name].usedCount = (students[name].usedCount || 0) + 1;
        }
        markStudentPicked(name);
        if (wheelState._spinForSlot === 'left') {
            battleState.leftStudent = name;
            document.getElementById('wheel-label').innerText = '宸︽柟鏂板疂鍙ⅵ锛? + name + ' 鉁?;
        } else {
            battleState.rightStudent = name;
            document.getElementById('wheel-label').innerText = '鍙虫柟鏂板疂鍙ⅵ锛? + name + ' 鉁?;
        }
        wheelState.excludeStudent = null;
        wheelState.lastSpunName = name;
        wheelState._spinForSlot = wheelState._spinForSlot; // keep for confirmStudent
        onWheelComplete = origComplete;
        // Show confirm + skip buttons, wait for teacher action
        document.getElementById('wheel-result-actions').classList.remove('hidden');
        document.getElementById('confirm-student-btn').classList.remove('hidden');
        document.getElementById('skip-student-btn').classList.remove('hidden');
    };
}

function spinForBoth() {
    document.getElementById('battle-view').classList.add('hidden');
    document.getElementById('wheel-result-actions').classList.add('hidden');
    document.getElementById('confirm-student-btn').classList.add('hidden');
    document.getElementById('skip-student-btn').classList.add('hidden');
    clearTimeout(wheelTimeout);
    wheelState.spinCount = 0;
    wheelState.firstStudent = null;
    wheelState.secondStudent = null;
    // Reset both skill slots since both players are being replaced
    skillState.leftSkill = null; skillState.leftSkillConsumed = false; skillState.leftDoubleScore = false;
    skillState.rightSkill = null; skillState.rightSkillConsumed = false; skillState.rightDoubleScore = false;
    skillState.leftLastSkillStreak = 0; skillState.rightLastSkillStreak = 0;
    // 涓嶈冻涓や汉鍙嚭鎴?鈫?鐩存帴杩涘叆鎬荤粨锛屼笉鍐嶅娲诲凡娣樻卑瀛︾敓
    var uneliminated = Object.keys(students).filter(function(n) { return !students[n].eliminated; });
    if (uneliminated.length < 2) {
        endGameEarly();
        return;
    }
    startWheelPhase();
}

// ============ SECTION 8: TIMER ============
function startBattleTimer(seconds, phase, side) {
    stopBattleTimer();
    battleState.timerRemaining = seconds;
    battleState.timerPhase = phase;
    battleState.timerActiveSide = side || null;
    updateTimerDisplay(seconds, seconds);
    battleState.timerInterval = setInterval(function() {
        battleState.timerRemaining--;
        updateTimerDisplay(battleState.timerRemaining, seconds);
        if (battleState.timerRemaining <= 5 && battleState.timerRemaining > 0) playCountTick();
        if (battleState.timerRemaining <= 0) {
            stopBattleTimer();
            handleTimerExpired(phase, side);
        }
    }, 1000);
}

function stopBattleTimer() {
    if (battleState.timerInterval) { clearInterval(battleState.timerInterval); battleState.timerInterval = null; }
}

function updateTimerDisplay(remaining, total) {
    var pct = (remaining / total) * 100;
    var fill = document.getElementById('timer-bar-fill');
    var text = document.getElementById('timer-text');
    fill.style.width = pct + '%';
    text.innerText = remaining;
    if (remaining <= 3) fill.style.background = '#ef4444';
    else if (remaining <= 5) fill.style.background = '#eab308';
    else fill.style.background = '#22c55e';
}

function handleTimerExpired(phase, side) {
    if (phase === 'waiting') {
        // Both failed to buzz
        resolveRound('both_lose');
        speak('鏃堕棿鍒帮紒鍙屾柟閮芥湭鎶㈢瓟锛?);
    } else if (phase === 'answering') {
        if (!battleState.secondChance) {
            battleState.secondChance = true;
            // Lock the timed-out student's buzzer instead of auto-giving to opponent
            var timedOutSide = side;
            if (timedOutSide === 'left') buzzerFailedLeft = true;
            else buzzerFailedRight = true;
            setSingleBuzzerEnabled(timedOutSide, false);
            var failedNameEl = document.getElementById(timedOutSide === 'left' ? 'buzzer-left-name' : 'buzzer-right-name');
            failedNameEl.textContent = '鈴?' + (timedOutSide === 'left' ? battleState.leftStudent : battleState.rightStudent) + '锛堣秴鏃讹級';
            document.getElementById(timedOutSide === 'left' ? 'buzzer-left-btn' : 'buzzer-right-btn').classList.remove('active-buzz');

            var oppSide = timedOutSide === 'left' ? 'right' : 'left';
            battleState.buzzerWinner = null;
            battleState.timerPhase = 'waiting';
            battleState.timerActiveSide = null;
            setOptionsEnabled(false);
            // Re-enable opponent's buzzer and resume main countdown
            setSingleBuzzerEnabled(oppSide, true);
            document.getElementById('timer-label').innerText = '鈴憋笍 鎶㈢瓟鍊掕鏃?;
            startBattleTimer(pausedTimerRemaining, 'waiting');
            var oppName = oppSide === 'left' ? battleState.leftStudent : battleState.rightStudent;
            speak(oppName + '锛岃疆鍒颁綘浜嗭紒');
        } else {
            resolveRound('both_lose');
            speak('鏃堕棿鍒帮紒鍙屾柟閮芥湭绛斿锛?);
        }
    }
}

// ============ SECTION 9: LEADERBOARD ============
function showLeaderboard() {
    if (gameMode === 'group') { showGroupLeaderboard(); return; }
    stopRenderLoop();
    playVictorySound();
    document.getElementById('battle-view').classList.add('hidden');
    document.getElementById('public-enemy-signup-panel').classList.add('hidden');

    var sorted = Object.values(students).sort(function(a, b) {
        if (b.wins !== a.wins) return b.wins - a.wins;
        if (b.bestStreak !== a.bestStreak) return b.bestStreak - a.bestStreak;
        var rateA = a.totalQuestions > 0 ? a.correctAnswers / a.totalQuestions : 0;
        var rateB = b.totalQuestions > 0 ? b.correctAnswers / b.totalQuestions : 0;
        return rateB - rateA;
    });

    var body = document.getElementById('leaderboard-body');
    if (sorted.length === 0 || sorted.every(function(s) { return s.totalQuestions === 0; })) {
        // No battles have been played yet 鈥?show early-end message
        body.innerHTML = '<tr><td colspan="6" class="p-12 text-center text-4xl font-black opacity-70">馃弳 灏氭湭寮€濮嬪鎴橈紝褰撳墠鍙傛垬鍚嶅崟</td></tr>';
        sorted.forEach(function(s, i) {
            body.innerHTML += '<tr><td colspan="6" class="p-4 text-center text-2xl">' + ('馃馃馃'[i]||' ') + ' ' + escapeHtml(s.name) + '</td></tr>';
        });
    } else {
        body.innerHTML = sorted.map(function(s, i) {
        var badge = i === 0 ? '馃弳' : i === 1 ? '馃' : i === 2 ? '馃' : '';
        var winRate = s.totalQuestions > 0 ? Math.round(s.correctAnswers / s.totalQuestions * 100) : 0;
        var charEmoji = s.character ? HEROES[s.character].emoji : '鉂?;
        var charName = s.character ? HEROES[s.character].name : '-';
        var levelStars = '猸?.repeat(s.level || 1);

        return '<tr class="border-b border-white/10 ' + (i < 3 ? 'bg-yellow-50/10' : '') + '">' +
            '<td class="p-6 text-center text-4xl font-black">' + badge + ' #' + (i+1) + '</td>' +
            '<td class="p-6 text-3xl font-black">' + escapeHtml(s.name) + '</td>' +
            '<td class="p-6 text-center text-2xl">' + charEmoji + ' ' + charName + ' ' + levelStars + '</td>' +
            '<td class="p-6 text-center text-3xl font-black text-yellow-400">' + s.wins + '</td>' +
            '<td class="p-6 text-center text-2xl font-black text-orange-400">馃敟 ' + s.bestStreak + '</td>' +
            '<td class="p-6 text-center text-2xl">' + winRate + '%</td></tr>';
    }).join('');
    }

    // Show leaderboard view and speak in BOTH branches (including early-end when no battles were played)
    document.getElementById('leaderboard-view').classList.remove('hidden');
    speak('鍐虫垬缁撴潫锛佹伃鍠滆幏鑳滆€咃紒');
}

    const element = document.createElement('div');

function downloadStandaloneQuiz() {
    if (!scenes || scenes.length === 0) { alert('娌℃湁鍙笅杞界殑棰樼洰锛?); return; }
    var title = document.querySelector('h1') ? document.querySelector('h1').innerText : '浜掑姩 Quiz';
    var html = buildStandaloneHtml(scenes, title);
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = (title.replace(/\s+/g, '_') || 'quiz') + '_澶у喅鎴?html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

async function detectModels() {
    var sel = document.getElementById('model-select'), status = document.getElementById('model-status');
    try {
        var res = await fetch(WORKER_URL + '/models');
        var data = await res.json();
        sel.innerHTML = '';
        if (data.models) {
            data.models.forEach(function(m) {
                var opt = document.createElement('option');
                opt.value = m.name; opt.textContent = m.displayName || m.name;
                sel.appendChild(opt);
            });
        }
        if (sel.options.length > 0) { sel.selectedIndex = 0; selectedModel = sel.value; status.innerText = '鉁?AI 鏈嶅姟杩炴帴鎴愬姛'; sel.style.display = 'block'; }
        else throw new Error('No models');
    } catch (e) {
        console.warn('Model detection failed', e);
        status.innerText = '鈿狅笍 鑷姩杩炴帴澶辫触锛屼娇鐢ㄥ唴缃嚎璺?;
        sel.innerHTML = '';
        ['models/gemini-3-flash-preview'].forEach(function(m) {
            var opt = document.createElement('option'); opt.value = m; opt.textContent = m.replace('models/',''); sel.appendChild(opt);
        });
        sel.selectedIndex = 0; selectedModel = sel.value; sel.style.display = 'block';
    }
    window._modelsDetected = true;
}

function adjustDiffCount(diff, delta) {
    var input = document.getElementById(diff + '-count');
    input.value = Math.max(0, Math.min(30, parseInt(input.value || 0) + delta));
    validateDiffSum();
}

function validateDiffSum() {
    var total = parseInt(document.getElementById('q-count-input').value);
    var easy = parseInt(document.getElementById('easy-count').value || 0);
    var medium = parseInt(document.getElementById('medium-count').value || 0);
    var hard = parseInt(document.getElementById('hard-count').value || 0);
    var sum = easy + medium + hard;
    var errorEl = document.getElementById('diff-sum-error');
    if (sum !== total) {
        errorEl.classList.remove('hidden');
        errorEl.innerText = '鈿狅笍 褰撳墠鎬诲拰 ' + sum + '锛岄渶绛変簬鎬婚鏁?' + total + '锛? + (sum < total ? '杩樺樊 ' + (total-sum) + ' 棰? : '澶氬嚭 ' + (sum-total) + ' 棰?) + '锛?;
    } else {
        errorEl.classList.add('hidden');
    }
}

async function extractPptxText(file) {
    var zip = new JSZip();
    var zipContent = await zip.loadAsync(file);
    var text = '';
    var slideFiles = Object.keys(zipContent.files).filter(function(name) { return name.startsWith('ppt/slides/slide') && name.endsWith('.xml'); }).sort();
    for (var i = 0; i < slideFiles.length; i++) {
        var slideXml = await zipContent.file(slideFiles[i]).async('text');
        var matches = slideXml.match(/<a:t>([^<]*)<\/a:t>/g) || [];
        matches.forEach(function(match) { var content = match.replace(/<\/?a:t>/g, ''); if (content.trim()) text += content + '\n'; });
    }
    return text;
}

async function handleFileUpload(input) {
    var file = input.files[0]; if (!file) return;
    try {
        var statusEl = document.getElementById('upload-status');
        statusEl.classList.remove('hidden');
        if (file.type === 'application/pdf') {
            var arrayBuffer = await file.arrayBuffer();
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
            var pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            var fullText = '';
            for (var i = 1; i <= pdf.numPages; i++) {
                var page = await pdf.getPage(i);
                var content = await page.getTextContent();
                fullText += content.items.map(function(item) { return item.str; }).join(' ') + '\n';
            }
            document.getElementById('source-text').value = fullText;
        } else if (file.name.endsWith('.docx')) {
            var ab = await file.arrayBuffer();
            var result = await mammoth.extractRawText({ arrayBuffer: ab });
            document.getElementById('source-text').value = result.value;
        } else if (file.name.endsWith('.pptx')) {
            var t = await extractPptxText(file);
            document.getElementById('source-text').value = t;
        }
        statusEl.classList.add('hidden');
    } catch (e) { alert('鏂囨。瑙ｆ瀽澶辫触锛? + e.message); document.getElementById('upload-status').classList.add('hidden'); }
}

// ============ SECTION 12: KEYBOARD + INIT ============
document.addEventListener('keydown', function(e) {
    if (battleState.phase !== 'battle' && document.getElementById('battle-view').classList.contains('hidden')) return;
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;

    if (e.key === 'q' || e.key === 'Q') { e.preventDefault(); handleBuzzer('left'); }
    else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); handleBuzzer('right'); }
    else if (e.key === '1') { e.preventDefault(); if (battleState.timerPhase === 'answering' && !turnOverlayActive) handleAnswerChoice(0); }
    else if (e.key === '2') { e.preventDefault(); if (battleState.timerPhase === 'answering' && !turnOverlayActive) handleAnswerChoice(1); }
    else if (e.key === '3') { e.preventDefault(); if (battleState.timerPhase === 'answering' && !turnOverlayActive) handleAnswerChoice(2); }
    else if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        var noteEl = document.getElementById('battle-note');
        if (noteEl && !noteEl.classList.contains('hidden')) proceedAfterRound();
    }
});

window.onload = function() {
    var style = localStorage.getItem('quiz_style') || 'tech';
    document.body.className = 'theme-' + style;
    detectModels();  // Always load models on page load
    loadHeroAssets();  // 棰勫姞杞借嫳闆勭珛缁?+ 鎴樻枟 sprite
    loadSettings();
    // Auto-save config
    document.querySelectorAll('#setup-view input, #setup-view select, #setup-view textarea').forEach(function(el) {
        el.addEventListener('change', saveSettings);
        el.addEventListener('input', saveSettings);
    });
};

function saveSettings() {
    try {
        var s = {
            qCount: document.getElementById('q-count-input').value,
            easyCount: document.getElementById('easy-count').value,
            mediumCount: document.getElementById('medium-count').value,
            hardCount: document.getElementById('hard-count').value,
            shuffleDifficulty: document.getElementById('shuffle-difficulty').checked,
            timerEnabled: document.getElementById('timer-enabled').checked,
            timerSeconds: document.getElementById('timer-seconds-input').value,
            answerSeconds: document.getElementById('answer-seconds-input').value,
            studentList: document.getElementById('student-list').value,
            sourceText: document.getElementById('source-text').value,
            apiKey: localStorage.getItem('battle_api_key') || ''
        };
        localStorage.setItem('quiz_battle_settings', JSON.stringify(s));
    } catch (e) {}
}

function loadSettings() {
    try {
        var raw = localStorage.getItem('quiz_battle_settings');
        if (!raw) return;
        var s = JSON.parse(raw);
        if (s.qCount) document.getElementById('q-count-input').value = s.qCount;
        if (s.easyCount) document.getElementById('easy-count').value = s.easyCount;
        if (s.mediumCount) document.getElementById('medium-count').value = s.mediumCount;
        if (s.hardCount) document.getElementById('hard-count').value = s.hardCount;
        if (s.shuffleDifficulty !== undefined) document.getElementById('shuffle-difficulty').checked = s.shuffleDifficulty;
        if (s.timerEnabled !== undefined) document.getElementById('timer-enabled').checked = s.timerEnabled;
        if (s.timerSeconds) document.getElementById('timer-seconds-input').value = s.timerSeconds;
        if (s.answerSeconds) document.getElementById('answer-seconds-input').value = s.answerSeconds;
        if (s.studentList) document.getElementById('student-list').value = s.studentList;
        if (s.sourceText) document.getElementById('source-text').value = s.sourceText;
        document.getElementById('q-count-val').innerText = s.qCount || '10';
        document.getElementById('diff-total-target').innerText = s.qCount || '10';
        document.getElementById('timer-val').innerText = s.timerSeconds || '20';
        document.getElementById('answer-val').innerText = s.answerSeconds || '5';
        if (!s.timerEnabled) {
            document.getElementById('timer-group').classList.add('hidden');
        }
        validateDiffSum();
    } catch (e) {}

    // Load API key separately (not stored in quiz_battle_settings for security)
    var savedKey = localStorage.getItem('battle_api_key') || '';
    var keyInput = document.getElementById('api-key-input');
    if (keyInput) {
        keyInput.value = savedKey;
        keyInput.addEventListener('input', function() {
            localStorage.setItem('battle_api_key', this.value);
        });
    }
}
