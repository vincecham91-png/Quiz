<style>

    --btn-red: #ef4444; --btn-blue: #3b82f6;
}

body {

}
.glass-panel {

}
.setup-input, textarea, select, input[type="number"] {

.theme-cute .setup-input, .theme-cute textarea, .theme-cute select, .theme-cute input[type="number"] {

.theme-cute .setup-input::placeholder, .theme-cute textarea::placeholder { color: #a0a0a0; }
.theme-cute h1, .theme-cute h2, .theme-cute h3, .theme-cute label { color: var(--text-main) !important; }
.theme-cute .bg-white { background-color: var(--card-bg) !important; }
.theme-cute .text-gray-700, .theme-cute .text-gray-800 { color: var(--text-main) !important; }

/* Cream theme 鈥?battle UI overrides */

.theme-cute .option-btn {

    box-shadow: 0 4px 0 #e8d5b7; text-shadow: none;
}
.theme-cute .option-btn:hover:not(:disabled) { background: var(--primary); border-color: #d4607a; color: #fff; box-shadow: 0 4px 0 #d4607a; }
.theme-cute .option-btn.correct-answer { background: #065f46 !important; border-color: #22c55e !important; color: #fff !important; box-shadow: none; }
.theme-cute .option-btn.wrong-choice { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fff !important; box-shadow: none; }
.theme-cute .option-btn:disabled { background: #f0e6d2; border-color: #e8d5b7; color: rgba(92,82,70,0.4); box-shadow: none; text-shadow: none; }
.theme-cute .buzzer-side-left { color: #5c5246; background: rgba(239,68,68,0.15); border-left: 3px solid rgba(239,68,68,0.4); }
.theme-cute .buzzer-side-left:hover, .theme-cute .buzzer-side-left.active-buzz { color: #fff; background: rgba(239,68,68,0.7) !important; }
.theme-cute .buzzer-side-right { color: #5c5246; background: rgba(59,130,246,0.15); border-right: 3px solid rgba(59,130,246,0.4); }
.theme-cute .buzzer-side-right:hover, .theme-cute .buzzer-side-right.active-buzz { color: #fff; background: rgba(59,130,246,0.7) !important; }
.theme-cute .timer-bar-bg { background: rgba(0,0,0,0.08); }
.theme-cute .char-card { border-color: #e8d5b7; }

/* Tech theme overrides */
.theme-tech .bg-white { background-color: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; }
.theme-tech .bg-green-50, .theme-tech .bg-yellow-50, .theme-tech .bg-red-50,
.theme-tech .bg-blue-50, .theme-tech .bg-gray-50, .theme-tech .bg-purple-50 { background-color: rgba(0,0,0,0.2) !important; border-color: rgba(255,255,255,0.1) !important; }
.theme-tech .text-green-700, .theme-tech .text-green-800 { color: #4ade80 !important; }
.theme-tech .text-yellow-700, .theme-tech .text-yellow-800 { color: #fbbf24 !important; }
.theme-tech .text-red-700, .theme-tech .text-red-800 { color: #f87171 !important; }
.theme-tech .text-purple-900, .theme-tech .text-gray-500, .theme-tech .text-gray-700, .theme-tech .text-gray-800 { color: #cbd5e1 !important; }
.theme-tech .text-blue-900 { color: #60a5fa !important; }

.btn-primary {
    background: var(--primary); color: white; font-weight: 900;
    padding: 1.5rem 3rem; border-radius: 20px; box-shadow: 0 10px 0 #00000022;
    transition: all 0.2s; cursor: pointer; border: none;
}
.btn-primary:active { transform: translateY(4px); box-shadow: none; }

/* Battle-specific styles */
#battle-view { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
#battle-view.hidden { display: none; }
#battle-canvas { width: 100%; height: 100%; display: block; }
.battle-arena { position: relative; height: 38vh; min-height: 250px; background: #1a1a2e; overflow: hidden; }
.question-zone { position: relative; padding: 0.4rem 85px 0.4rem 85px; display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-height: 0; }

/* Floating side buzzer buttons */
.buzzer-side {
    position: absolute; top: 0; bottom: 0; width: 80px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: none; cursor: pointer; transition: all 0.15s;
    font-size: 1.1rem; font-weight: 900; gap: 0.3rem;
    user-select: none; -webkit-user-select: none; z-index: 10;
}
.buzzer-side:active { transform: scale(0.93); }
.buzzer-side-left {
    left: 0; border-radius: 0 12px 12px 0;
    background: rgba(239,68,68,0.25);
    color: rgba(255,255,255,0.85); border-left: 3px solid rgba(239,68,68,0.4);
}
.buzzer-side-left:hover, .buzzer-side-left.active-buzz {
    background: rgba(239,68,68,0.7) !important;
    border-left-color: #fff; box-shadow: 0 0 40px rgba(239,68,68,0.7);
}
.buzzer-side-right {
    right: 0; border-radius: 12px 0 0 12px;
    background: rgba(59,130,246,0.25);
    color: rgba(255,255,255,0.85); border-right: 3px solid rgba(59,130,246,0.4);
}
.buzzer-side-right:hover, .buzzer-side-right.active-buzz {
    background: rgba(59,130,246,0.7) !important;
    border-right-color: #fff; box-shadow: 0 0 40px rgba(59,130,246,0.7);
}
.buzzer-side:disabled { opacity: 0.15; pointer-events: none; }
.buzzer-side .buzzer-emoji { font-size: 1.8rem; }
.buzzer-side .buzzer-name { font-size: 0.85rem; text-align: center; line-height: 1.2; }

.option-btn {
    display: block; width: 100%; padding: 1rem 1.5rem; margin-bottom: 0.5rem;
    background: rgba(255,255,255,0.18); border: 3px solid rgba(255,255,255,0.4);
    border-radius: 14px; color: #ffffff; font-size: 1.7rem; font-weight: 800;
    text-align: left; cursor: pointer; transition: all 0.2s;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.option-btn:hover:not(:disabled) { background: var(--primary); border-color: #fff; transform: scale(1.01); }
.option-btn:disabled {
    background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6); cursor: not-allowed; text-shadow: none;
}
.option-btn.correct-answer { background: #065f46 !important; border-color: #22c55e !important; color: #fff !important; }
.option-btn.wrong-choice { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fff !important; }

.char-card {
    background: var(--card-bg); border: 3px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 1rem; cursor: pointer; text-align: center;
    transition: all 0.2s; display: flex; flex-direction: column; align-items: center;
}
.char-card:hover { transform: scale(1.05); border-color: var(--primary); box-shadow: var(--shadow); }
.char-card.selected { border-color: var(--accent); box-shadow: 0 0 30px var(--accent); }
.char-card.taken { opacity: 0.3; pointer-events: none; }
.char-portrait { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 14px; background: #101624; }

/* 瀹濆彲姊﹀嚭鍦?intro 瑕嗙洊灞?鈥斺€?鍏ㄥ睆娌夋蹈寮?*/
#intro-view {
    position: fixed; inset: 0; z-index: 9000; background: #000;
    overflow: hidden;
}
#intro-view.hidden { display: none; }
#intro-video {
    position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: cover;
    background: #000; z-index: 1;
}
#intro-portrait {
    position: fixed; inset: 0; width: 100vw; height: 100vh; object-fit: contain;
    background: radial-gradient(circle at 50% 40%, #1b2440 0%, #0d1220 70%); z-index: 1;
}
#intro-text {
    position: fixed; left: 0; right: 0; bottom: 6vh; z-index: 10;
    text-align: center; pointer-events: none; padding: 0 4vw;
}
#intro-name { font-size: clamp(2.5rem, 8vw, 5.5rem); font-weight: 900; color: #ffd700; text-shadow: 0 0 30px rgba(255,215,0,0.6), 0 2px 14px rgba(0,0,0,0.9); }
#intro-line { font-size: clamp(1.1rem, 3vw, 1.8rem); color: #fff; font-style: italic; margin-top: 0.6rem; text-shadow: 0 2px 12px rgba(0,0,0,0.9); }
#intro-role { display: inline-block; background: rgba(20,26,44,0.75); color: #e6d9a8; border: 1px solid rgba(255,215,0,0.35); border-radius: 999px; padding: 4px 20px; font-size: 1rem; margin-top: 0.8rem; }

.timer-bar-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.1); border-radius: 6px; overflow: hidden; }
.timer-bar-fill { height: 100%; border-radius: 6px; transition: width 1s linear, background 0.5s; background: #22c55e; }

@keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(251,191,36,0.4)} 50%{box-shadow:0 0 60px rgba(251,191,36,0.9)} }
@keyframes bounce-in { 0%{transform:scale(0.8);opacity:0} 50%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

.animate-bounce-in { animation: bounce-in 0.5s ease-out; }
.animate-shake { animation: shake 0.4s ease-in-out; }
.animate-pulse-glow { animation: pulse-glow 1.5s infinite; }

.streak-flame { color: #f97316; font-size: 1.5rem; animation: float 0.5s infinite ease-in-out; }

/* VS overlay */
#vs-overlay {
    position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
}
#vs-overlay.hidden { display: none; }
#vs-text { font-family: 'Orbitron', sans-serif; font-size: 8rem; font-weight: 900; color: var(--accent); }

/* Skill wheel overlay */
#skill-wheel-overlay {
    position: fixed; inset: 0; z-index: 9998; background: rgba(0,0,0,0.85);
    display: flex; align-items: center; justify-content: center;
}
#skill-wheel-overlay.hidden { display: none; }
#skill-spinner {
    width: 300px; height: 300px; border-radius: 50%;
    margin: 1.5rem auto; position: relative;
    transition: transform 3.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}
.skill-segment-label {
    position: absolute; font-size: 1.3rem; font-weight: 900;
    color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    white-space: nowrap;
}
#skill-spinner-pointer {
    position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent; border-right: 18px solid transparent;
    border-top: 28px solid #fbbf24; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
}
#skill-result-display { text-align: center; animation: bounce-in 0.5s ease-out; }
@keyframes shield-pulse {
    0%,100% { opacity: 0.6; }
    50% { opacity: 1; }
}
@keyframes giant-attack-shake {
    0%,100% { transform: translate(0, 0) scale(1); }
    10% { transform: translate(-4px, -2px) scale(1.05); }
    30% { transform: translate(4px, 2px) scale(1.1); }
    50% { transform: translate(-2px, -1px) scale(1.08); }
    70% { transform: translate(2px, 1px) scale(1.04); }
    90% { transform: translate(-1px, 0) scale(1.02); }
}

/* Group player buttons */
.group-player-btn {
    padding: 0.8rem 2rem; border-radius: 999px; border: 3px solid rgba(255,255,255,0.3);
    background: rgba(139,92,246,0.3); color: #fff; font-size: 1.3rem; font-weight: 800;
    cursor: pointer; transition: all 0.2s; min-width: 140px;
}
.group-player-btn:hover { background: rgba(139,92,246,0.6); border-color: #c084fc; transform: scale(1.05); }
.group-player-btn.selected { background: #7c3aed; border-color: #fff; box-shadow: 0 0 20px rgba(139,92,246,0.7); }
.group-player-btn.eliminated { background: rgba(100,100,100,0.2); border-color: rgba(100,100,100,0.2); color: rgba(255,255,255,0.3); pointer-events: none; text-decoration: line-through; }

/* Group card in setup */
.group-setup-card {
    background: rgba(139,92,246,0.1); border: 2px solid rgba(139,92,246,0.3);
    border-radius: 16px; padding: 1.5rem;
}
.group-setup-card .group-name-input {
    font-size: 1.3rem; font-weight: 900; padding: 0.5rem 1rem;
    border: 2px solid rgba(139,92,246,0.4); border-radius: 10px;
    background: rgba(255,255,255,0.1); color: #fff; width: 200px;
}
.group-setup-card .group-name-input:focus { border-color: #c084fc; outline: none; }
.group-setup-card .player-name-input {
    font-size: 1rem; font-weight: 700; padding: 0.4rem 0.8rem;
    border: 2px solid rgba(255,255,255,0.2); border-radius: 8px;
    background: rgba(255,255,255,0.08); color: #fff; width: 180px;
}
.group-setup-card .player-name-input:focus { border-color: #a78bfa; outline: none; }

/* Cream theme 鈥?group setup inputs fix */
.theme-cute .group-setup-card .group-name-input,
.theme-cute .group-setup-card .player-name-input {
    color: #5c5246 !important; background: #ffffff !important; border-color: #f0e6d2;
}
.theme-cute .group-setup-card .group-name-input::placeholder,
.theme-cute .group-setup-card .player-name-input::placeholder { color: #a0a0a0; }

/* 澶ф嫑鎶€鑳藉脊绐?鈥斺€?绾㈣壊璀﹀憡椋庢牸 */
.skill-popup-overlay {
    position: fixed; inset: 0; z-index: 10000;
    background: rgba(127,29,29,0.95);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(10px); animation: fade-in 0.3s ease-out;
}

.skill-popup-overlay.hidden {
    display: none;
}

.skill-popup-content {
    position: relative;
    background: linear-gradient(145deg, #dc2626 0%, #b91c1c 50%, #991b1b 100%);
    border: 4px solid #fca5a5;
    border-radius: 24px;
    padding: 3rem;
    max-width: 700px;
    width: 90%;
    box-shadow:
        0 0 60px rgba(239,68,68,0.6),
        0 0 100px rgba(239,68,68,0.3),
        inset 0 0 40px rgba(0,0,0,0.2);
    animation: skill-popup-in 0.5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
    text-align: center;
}

.skill-popup-icon {
    font-size: 5rem;
    margin-bottom: 1rem;
    animation: float 2s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(251,191,36,0.8));
}

.skill-popup-title {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 900;
    color: #fff;
    margin: 0.5rem 0 2rem 0;
    text-shadow:
        0 0 20px rgba(255,215,0,0.6),
        0 2px 4px rgba(0,0,0,0.8),
        2px 2px 0 #7f1d1d;
    letter-spacing: 0.05em;
}

.skill-popup-text {
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    font-weight: 700;
    color: #fef2f2;
    line-height: 1.6;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    margin-top: 1rem;
}

.skill-popup-text br {
    margin: 0.8rem 0;
}

/* 鍔ㄧ敾瀹氫箟 */
@keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes skill-popup-in {
    from {
        opacity: 0;
        transform: scale(0.5) translateY(50px);
    }
    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-15px);
    }
}
</style>

function playSynth(freq, type, vol, dur) {
    if (!audioCtx) return;
    try {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.setValueAtTime(freq, audioCtx.currentTime);
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
}

function playNoise(dur, vol, filterFreq) {
    if (!audioCtx) return;
    try {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * vol;
        const src = audioCtx.createBufferSource(), flt = audioCtx.createBiquadFilter(), g = audioCtx.createGain();
        src.buffer = buf; flt.type = 'bandpass'; flt.frequency.value = filterFreq || 1000;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
        src.start(); src.stop(audioCtx.currentTime + dur);
    } catch (e) {}
}

function renderGroupCards() {

        var gName = card.querySelector('.group-name-input');
        var gData = { name: gName ? gName.value : '', players: [] };

        html += '</div>';
        html += '<div class="flex flex-wrap gap-3 ml-10">';
        for (var p = 0; p < playersPerGroup; p++) {
            var pNum = p + 1;
            var playerName = (saved.players && saved.players[p]) ? saved.players[p] : (groupName + '鐜╁' + pNum);
            html += '<input class="player-name-input" value="' + escHTML(playerName) + '" placeholder="' + escHTML(groupName) + '鐜╁' + pNum + '">';
        }
        html += '</div></div>';
    }
    container.innerHTML = html;
}

// 棰勫姞杞藉閮ㄥ浘鐗囧苟缂撳瓨
function preloadExternalImage(key) {
    const url = PORTRAIT_URLS[key];
    if (!url) return;

    // 鍔犺浇鎴樻枟绔嬬粯 (128x160)
    const battleImg = new Image();
    battleImg.crossOrigin = 'anonymous';
    battleImg.onload = () => { battleSpriteCache[key] = battleImg; };
    battleImg.onerror = () => { battleSpriteCache[key] = createFallbackBattleSprite(key); };
    battleImg.src = url;

    // 鍔犺浇澶村儚 (鍦嗗舰瑁佸壀)
    const portraitImg = new Image();
    portraitImg.crossOrigin = 'anonymous';
    portraitImg.onload = () => { portraitCache[key] = portraitImg; };
    portraitImg.onerror = () => { portraitCache[key] = createFallbackPortrait(key); };
    portraitImg.src = url;
}

// Canvas 鍥為€€鏂规锛堝浘鐗囧姞杞藉け璐ユ椂浣跨敤锛?
function createFallbackBattleSprite(key) {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 160;
    const ctx = c.getContext('2d');
    drawPokemon(ctx, key, 64, 140, 1);
    const img = new Image();
    img.src = c.toDataURL();
    return img;
}

function createFallbackPortrait(key) {
    const c = document.createElement('canvas');
    c.width = 200; c.height = 200;
    const ctx = c.getContext('2d');
    ctx.beginPath();
    ctx.arc(100, 100, 95, 0, Math.PI * 2);
    ctx.clip();
    drawPokemon(ctx, key, 100, 90, 0.7);
    const img = new Image();
    img.src = c.toDataURL();
    return img;
}

function getCharacterCanvas(key, level) {
    const ck = key + '_' + level;
    if (charCache[ck]) return charCache[ck];
    const c = document.createElement('canvas'); c.width = 48; c.height = 48;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, 48, 48);
    drawPokemon(ctx, key, 24, 26, 1.0);
    charCache[ck] = { canvas: c };
    return charCache[ck];
}

// ============ SECTION 3: CANVAS BATTLE ARENA ============
let canvasW = 1200, canvasH = 500, groundY = 325;

// 鎴樻枟鍏ㄨ韩绔嬬粯楂樺害锛堥殢 arena 鑷€傚簲锛屼繚璇佸ご椤朵笉椤跺嚭鐢婚潰锛?
function charHeight() {
    return Math.min(230, Math.max(140, canvasH * 0.45));
}

function resizeCanvas() {
    const container = document.getElementById('arena-container');
    const canvas = document.getElementById('battle-canvas');
    if (!container || !canvas) return;
    canvas.width = container.clientWidth;
    canvas.height = container.clientHeight;
    canvasW = canvas.width; canvasH = canvas.height;
    groundY = Math.floor(canvasH * 0.65);
}

function startRenderLoop() {
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    function frame() {
        const canvas = document.getElementById('battle-canvas');
        if (!canvas) { stopRenderLoop(); return; }
        const ctx = canvas.getContext('2d'), w = canvas.width, h = canvas.height;
        const now = performance.now();

        ctx.clearRect(0, 0, w, h);
        drawBackground(ctx, w, h);
        // Draw shield bubbles behind characters
        if (!leftFallen) drawSkillShield(ctx, 'left', now);
        if (!rightFallen) drawSkillShield(ctx, 'right', now);
        if (!leftFallen) drawCharacterAt(ctx, 'left', battleState.leftCharacter, battleState.leftLevel, now);
        if (!rightFallen) drawCharacterAt(ctx, 'right', battleState.rightCharacter, battleState.rightLevel, now);
        drawScores(ctx, w, h, now);
        drawEffects(ctx, w, h, now);
        // Freeze overlay (time freeze skill)
        if (skillState.showFreezeOverlay) {
            ctx.fillStyle = 'rgba(50, 100, 200, 0.15)';
            ctx.fillRect(0, 0, w, h);
            for (var fi = 0; fi < 20; fi++) {
                var fpx = (fi * 73 + now * 0.02) % w;
                var fpy = (fi * 47 + now * 0.03) % h;
                ctx.fillStyle = 'rgba(200, 230, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(fpx, fpy, 2 + (fi % 3), 0, Math.PI * 2);
                ctx.fill();
            }
        }
        processAnimations(now);

        renderLoopId = requestAnimationFrame(frame);
    }
    frame();
}

function stopRenderLoop() {
    if (renderLoopId) { cancelAnimationFrame(renderLoopId); renderLoopId = null; }
    window.removeEventListener('resize', resizeCanvas);
}

function drawBackground(ctx, w, h) {
    const gY = groundY;
    const skyGrad = ctx.createLinearGradient(0, 0, 0, gY);
    skyGrad.addColorStop(0, '#1a1a4e'); skyGrad.addColorStop(0.5, '#4a6fa5'); skyGrad.addColorStop(1, '#87ceeb');
    ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, w, gY);
    // Clouds
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    drawCloud(ctx, w*0.12, h*0.08, 50);
    drawCloud(ctx, w*0.65, h*0.12, 40);
    drawCloud(ctx, w*0.85, h*0.06, 35);
    // Ground
    ctx.fillStyle = '#3a6b2f'; ctx.fillRect(0, gY, w, h - gY);
    ctx.fillStyle = '#4a7c3f'; ctx.fillRect(0, gY, w, 8);
    // Grass tufts
    ctx.fillStyle = '#2d5a1e';
    for (let x = 0; x < w; x += 25) {
        ctx.beginPath(); ctx.moveTo(x, gY); ctx.lineTo(x + 4, gY - 8); ctx.lineTo(x + 8, gY); ctx.fill();
    }
}

function drawCloud(ctx, x, y, r) {
    ctx.beginPath(); ctx.arc(x, y, r*0.6, 0, Math.PI*2);
    ctx.arc(x+r*0.5, y-r*0.2, r*0.5, 0, Math.PI*2);
    ctx.arc(x+r, y, r*0.55, 0, Math.PI*2);
    ctx.fill();
}

function drawHexagon(ctx, cx, cy, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
        var angle = (i / 6) * Math.PI * 2;
        var hx = cx + Math.cos(angle) * r;
        var hy = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
    }
    ctx.closePath();
    ctx.fill();
}

function drawSkillShield(ctx, side, now) {
    var hasShield = (side === 'left' && skillState.leftSkill === 'shield' && !skillState.leftSkillConsumed) ||
                    (side === 'right' && skillState.rightSkill === 'shield' && !skillState.rightSkillConsumed);
    if (!hasShield) return;
    var x = side === 'left' ? canvasW * 0.22 + 72 : canvasW * 0.78 + 72;
    var y = groundY - 144 + 72;
    var pulse = 1 + Math.sin(now * 0.005) * 0.05;
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(x, y, 85 * pulse, 95 * pulse, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100, 200, 255, 0.7)';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x, y, 80 * pulse, 90 * pulse, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(100, 200, 255, 0.08)';
    ctx.fill();
    // Rotating hexagons
    for (var i = 0; i < 6; i++) {
        var angle = (i / 6) * Math.PI * 2 + now * 0.001;
        var hx = x + Math.cos(angle) * 65;
        var hy = y + Math.sin(angle) * 70;
        drawHexagon(ctx, hx, hy, 8, 'rgba(150,220,255,0.3)');
    }
    ctx.restore();
}

function drawCharacterAt(ctx, side, charKey, level, now) {
    if (!charKey) return;
    const bounce = Math.sin(now * 0.003) * 2;
    const cx = side === 'left' ? canvasW * 0.22 + 72 : canvasW * 0.78 + 72;
    const sprite = getBattleSprite(charKey);
    if (sprite) {
        // AI 鍏ㄨ韩绔嬬粯锛堥€忔槑 PNG锛夛紝鎸夎嚜鐒舵瘮渚嬬粯鍒讹紝鑴氳惤鍦?groundY
        const h = charHeight();
        const w = h * sprite.naturalWidth / sprite.naturalHeight;
        const y = groundY - h + bounce;
        ctx.imageSmoothingEnabled = true;
        ctx.save();
        if (side === 'right') {
            ctx.translate(cx, y); ctx.scale(-1, 1); ctx.drawImage(sprite, -w/2, 0, w, h);
        } else {
            ctx.drawImage(sprite, cx - w/2, y, w, h);
        }
        ctx.restore();
        drawLevelGlow(ctx, cx, groundY - h * 0.55, level, now);
    } else {
        // 鍏滃簳锛氬儚绱犲皬浜猴紙PNG 鏈姞杞藉畬锛?
        const spriteSize = 144;
        const x = side === 'left' ? canvasW * 0.22 : canvasW * 0.78;
        const y = groundY - spriteSize + bounce;
        const ps = getCharacterCanvas(charKey, level);
        ctx.imageSmoothingEnabled = false;
        ctx.save();
        if (side === 'right') {
            ctx.translate(x, y); ctx.scale(-1, 1); ctx.drawImage(ps.canvas, -spriteSize, 0, spriteSize, spriteSize);
        } else {
            ctx.drawImage(ps.canvas, x, y, spriteSize, spriteSize);
        }
        ctx.restore();
    }
    // Name label
    const name = side === 'left' ? (battleState.leftStudent || '???') : (battleState.rightStudent || '???');
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px "Noto Sans SC"'; ctx.textAlign = 'center';
    ctx.fillText(name, cx, groundY + 24);
}

// 鍗囩骇鍏夌幆锛氶摱锛圠v2锛?閲戯紙Lv3锛夌幆缁曪紝鏇夸唬鍘熷儚绱犺鐢?
function drawLevelGlow(ctx, cx, cy, level, now) {
    if (level < 2) return;
    const h = charHeight();
    const pulse = 1 + Math.sin(now * 0.004) * 0.06;
    const col = level >= 3 ? '255,215,0' : '192,192,192';
    ctx.save();
    ctx.strokeStyle = 'rgba(' + col + ',0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(cx, cy, h * 0.5 * pulse, h * 0.62 * pulse, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
}

function drawScores(ctx, w, h, now) {
    const leftName = battleState.leftStudent, rightName = battleState.rightStudent;
    const leftScore = leftName && students[leftName] ? students[leftName].wins : 0;
    const rightScore = rightName && students[rightName] ? students[rightName].wins : 0;
    const leftStreak = leftName && students[leftName] ? students[leftName].streak : 0;
    const rightStreak = rightName && students[rightName] ? students[rightName].streak : 0;

    const headY = groundY - charHeight(); // 瑙掕壊澶撮《 y锛堝垎鏁?鎶€鑳芥嵁姝や笂绉伙紝閬垮厤閬尅鏇撮珮鐨勪汉鐗╋級
    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 48px "Orbitron", sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(leftScore, canvasW * 0.22 + 72, headY - 16);
    ctx.fillText(rightScore, canvasW * 0.78 + 72, headY - 16);
    // Streak flames
    if (leftStreak >= 3) {
        const fy = headY - 52 + Math.sin(now * 0.008) * 3;
        ctx.fillStyle = '#f97316'; ctx.font = '24px sans-serif';
        ctx.fillText('馃敟'.repeat(Math.min(leftStreak, 5)), canvasW * 0.22 + 72, fy);
    }
    if (rightStreak >= 3) {
        const fy = headY - 52 + Math.sin(now * 0.008 + 1) * 3;
        ctx.fillStyle = '#f97316'; ctx.font = '24px sans-serif';
        ctx.fillText('馃敟'.repeat(Math.min(rightStreak, 5)), canvasW * 0.78 + 72, fy);
    }
    // Skill icons above characters
    var skillIcons = { shield: '馃洝锔?, revive: '馃挌', time_freeze: '鉂勶笍', double_score: '鈿?, preemptive: '馃幆' };
    var skillY = headY - 80;
    if (skillState.leftSkill && !skillState.leftSkillConsumed) {
        ctx.font = '22px sans-serif';
        ctx.fillText((skillIcons[skillState.leftSkill] || '鉂?), canvasW * 0.22 + 72, skillY);
    }
    if (skillState.rightSkill && !skillState.rightSkillConsumed) {
        ctx.font = '22px sans-serif';
        ctx.fillText((skillIcons[skillState.rightSkill] || '鉂?), canvasW * 0.78 + 72, skillY);
    }
    // VS
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.font = 'bold 64px "Orbitron", sans-serif';
    ctx.fillText('VS', canvasW / 2, groundY - 100);
}

// ============ SECTION 4: ANIMATION ENGINE ============
const ANIM_TYPES = {
    ATTACK: 'attack', HIT: 'hit', FALL: 'fall', LEVEL_UP: 'levelUp', VS_COUNTDOWN: 'vsCd',
    KING_SLAYER: 'kingSlayer'
};

function addAttackAnimation(fromSide, charKey, isGiant) {
    const fromX = fromSide === 'left' ? canvasW * 0.22 + 144 : canvasW * 0.78 - 10;
    const toX = fromSide === 'left' ? canvasW * 0.78 : canvasW * 0.22 + 144;
    const y = groundY - 100;
    animations.push({
        type: ANIM_TYPES.ATTACK, startTime: performance.now(), duration: isGiant ? 800 : 600,
        fromSide, charKey, fromX, toX, y, isGiant: !!isGiant,
        onComplete: () => { addHitAnimation(fromSide === 'left' ? 'right' : 'left', isGiant); }
    });
}

function drawEffects(ctx, w, h, now) {
    const active = animations.filter(a => {
        const elapsed = now - a.startTime;
        if (elapsed >= a.duration) { if (a.onComplete) a.onComplete(); return false; }
        return true;
    });
    animations = active;

    active.forEach(a => {
        const t = Math.min((now - a.startTime) / a.duration, 1);
        switch (a.type) {
            case ANIM_TYPES.ATTACK: {
                const x = a.fromX + (a.toX - a.fromX) * t;
                const y = a.y + Math.sin(t * Math.PI) * -30;
                // Draw projectile based on character
                ctx.save(); ctx.imageSmoothingEnabled = true;

                // Giant weapon scale factor (double_score skill)
                var giantScale = a.isGiant ? 2.5 : 1.0;
                if (a.isGiant) {
                    ctx.save(); ctx.translate(x, y); ctx.scale(giantScale, giantScale); ctx.translate(-x, -y);
                    ctx.save(); ctx.translate(x, y); ctx.scale(giantScale, giantScale); ctx.translate(-x, -y);
                    ctx.restore(); // We'll re-save per-character below
                }

                // Trail particles (behind projectile, all classes)
                var trailCount = a.isGiant ? 8 : 4;
                for (let i = 1; i <= trailCount; i++) {
                    var trailT = Math.max(0, t - i * 0.08);
                    var trailX = a.fromX + (a.toX - a.fromX) * trailT;
                    var trailY = a.y + Math.sin(trailT * Math.PI) * -30 * giantScale;
                    ctx.fillStyle = a.isGiant
                        ? 'rgba(255,220,50,' + (0.6 - i * 0.06).toFixed(2) + ')'
                        : 'rgba(255,255,200,' + (0.35 - i * 0.07).toFixed(2) + ')';
                    ctx.beginPath(); ctx.arc(trailX, trailY, (a.isGiant ? 8 : 4) * giantScale, 0, Math.PI * 2); ctx.fill();
                }

                // Apply giant scale transform for the projectile
                if (a.isGiant) {
                    ctx.save(); ctx.translate(x, y); ctx.scale(giantScale, giantScale); ctx.translate(-x, -y);
                }

                switch ((HEROES[a.charKey] && HEROES[a.charKey].projectile) || a.charKey) {
                    // ---------- 鐨崱涓橈細闆烽浕 Shock Wave ----------
                    case 'pikachu':
                        ctx.strokeStyle = '#FFD600';
                        ctx.lineWidth = a.isGiant ? 6 : 4;
                        ctx.shadowColor = '#FFD600'; ctx.shadowBlur = a.isGiant ? 40 : 20;
                        ctx.beginPath();
                        for (let i = 0; i < 5; i++) {
                            const px = x - 30 + i * 15;
                            const py = y + Math.sin(i * 1.8) * (a.isGiant ? 20 : 12);
                            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                        }
                        ctx.stroke();
                        // 闁冮浕鐞?
                        ctx.fillStyle = '#FFD600';
                        ctx.beginPath(); ctx.arc(x + 15, y, a.isGiant ? 16 : 8, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#FFF';
                        ctx.beginPath(); ctx.arc(x + 15, y, a.isGiant ? 6 : 3, 0, Math.PI*2); ctx.fill();
                        break;

                    // ---------- 灏忕伀榫嶏細鐏劙鍣村皠 Flamethrower ----------
                    case 'charmander':
                        var flameLen = a.isGiant ? 70 : 35;
                        var flameGrad = ctx.createLinearGradient(x - flameLen, y, x, y);
                        flameGrad.addColorStop(0, 'transparent');
                        flameGrad.addColorStop(0.3, a.isGiant ? 'rgba(255,100,0,0.9)' : 'rgba(255,140,0,0.9)');
                        flameGrad.addColorStop(0.7, a.isGiant ? 'rgba(255,200,0,0.8)' : 'rgba(255,220,0,0.7)');
                        flameGrad.addColorStop(1, 'rgba(255,255,100,0)');
                        ctx.fillStyle = flameGrad;
                        ctx.beginPath();
                        ctx.moveTo(x, y - (a.isGiant ? 20 : 10));
                        ctx.quadraticCurveTo(x - flameLen*0.5, y - (a.isGiant ? 30 : 15), x - flameLen, y);
                        ctx.quadraticCurveTo(x - flameLen*0.5, y + (a.isGiant ? 30 : 15), x, y + (a.isGiant ? 20 : 10));
                        ctx.closePath(); ctx.fill();
                        // 鍏х劙
                        ctx.fillStyle = '#FFF700';
                        ctx.beginPath();
                        ctx.moveTo(x, y - 8);
                        ctx.quadraticCurveTo(x - flameLen*0.4, y - 6, x - flameLen*0.6, y);
                        ctx.quadraticCurveTo(x - flameLen*0.4, y + 6, x, y + 8);
                        ctx.closePath(); ctx.fill();
                        break;

                    // ---------- 濡欒洐绋瓙锛氱ó瀛愭闂滄 Bullet Seed ----------
                    case 'bulbasaur':
                        ctx.fillStyle = '#68D391'; ctx.shadowColor = '#48BB78'; ctx.shadowBlur = 10;
                        for (let i = 0; i < (a.isGiant ? 5 : 3); i++) {
                            const sx = x - 10 - i * 14;
                            const sy = y + (i % 2 === 0 ? -8 : 8);
                            ctx.beginPath(); ctx.arc(sx, sy, a.isGiant ? 7 : 4, 0, Math.PI*2); ctx.fill();
                        }
                        // 缍犺憠杩借工
                        ctx.fillStyle = '#48BB78';
                        for (let i = 0; i < 3; i++) {
                            const lx = x - 5 - i * 18;
                            const ly = y + Math.sin(i + t * 5) * 6;
                            ctx.beginPath();
                            ctx.ellipse(lx, ly, 6, 3, t * 3 + i, 0, Math.PI*2);
                            ctx.fill();
                        }
                        break;

                    // ---------- 鏉板凹榫滐細姘寸偖 Water Gun ----------
                    case 'squirtle':
                        var waterGrad = ctx.createRadialGradient(x-5, y, 0, x-5, y, a.isGiant?30:15);
                        waterGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                        waterGrad.addColorStop(0.4, '#63B3ED');
                        waterGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = waterGrad;
                        ctx.beginPath(); ctx.arc(x - (a.isGiant?25:12), y, a.isGiant?30:15, 0, Math.PI*2); ctx.fill();
                        // 姘存祦绶?
                        ctx.strokeStyle = '#90CDF4'; ctx.lineWidth = a.isGiant?5:3;
                        ctx.beginPath();
                        ctx.moveTo(x, y-6); ctx.quadraticCurveTo(x-20, y-12, x-35, y);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x, y+6); ctx.quadraticCurveTo(x-20, y+12, x-35, y);
                        ctx.stroke();
                        break;

                    // ---------- 瓒呭あ锛氱簿绁為帶鐢?Psybeam ----------
                    case 'mewtwo':
                        ctx.save(); ctx.translate(x, y); ctx.rotate(t * Math.PI * 2);
                        for (let i = 0; i < 6; i++) {
                            const angle = (i / 6) * Math.PI * 2;
                            ctx.fillStyle = i % 2 === 0 ? '#D6BCFA' : '#FBCFE8';
                            ctx.beginPath();
                            ctx.ellipse(Math.cos(angle)*12, Math.sin(angle)*12, a.isGiant?18:9, a.isGiant?6:3, angle, 0, Math.PI*2);
                            ctx.fill();
                        }
                        ctx.restore();
                        // 鏍稿績鍏夌悆
                        var coreGrad = ctx.createRadialGradient(x, y, 0, x, y, a.isGiant?20:10);
                        coreGrad.addColorStop(0, '#fff');
                        coreGrad.addColorStop(0.5, '#E9D8FD');
                        coreGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = coreGrad;
                        ctx.beginPath(); ctx.arc(x, y, a.isGiant?20:10, 0, Math.PI*2); ctx.fill();
                        break;

                    // ---------- 鑳″湴锛氬康鍔?Psychic ----------
                    case 'alakazam':
                        ctx.strokeStyle = a.isGiant ? '#F6AD55' : '#D69E2E';
                        ctx.lineWidth = a.isGiant ? 4 : 2;
                        ctx.shadowColor = '#F6AD55'; ctx.shadowBlur = 15;
                        for (let i = 0; i < 4; i++) {
                            const r = 8 + i * (a.isGiant ? 12 : 6);
                            ctx.beginPath();
                            ctx.arc(x, y, r, 0, Math.PI * 2 * (0.6 + i * 0.1));
                            ctx.stroke();
                        }
                        // 鍕哄瓙鐧煎厜
                        ctx.fillStyle = '#FFD700';
                        ctx.beginPath(); ctx.arc(x + (a.isGiant?20:10), y - (a.isGiant?15:8), 4, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(x - (a.isGiant?20:10), y - (a.isGiant?15:8), 4, 0, Math.PI*2); ctx.fill();
                        break;

                    // ---------- 娌欏鏈碉細鏈堜寒涔嬪姏 Moonblast ----------
                    case 'gardevoir':
                        ctx.save(); ctx.translate(x, y);
                        // 绮夎壊鍏夋潫
                        var beamGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, a.isGiant?40:20);
                        beamGrad.addColorStop(0, 'rgba(255,255,255,0.9)');
                        beamGrad.addColorStop(0.3, '#FC8181');
                        beamGrad.addColorStop(0.7, '#F687B3');
                        beamGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = beamGrad;
                        ctx.beginPath(); ctx.arc(0, 0, a.isGiant?40:20, 0, Math.PI*2); ctx.fill();
                        // 鏈堜寒褰㈢媭
                        ctx.fillStyle = '#FED7D7';
                        ctx.beginPath(); ctx.arc(6, -4, a.isGiant?12:6, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = 'transparent';
                        ctx.beginPath(); ctx.arc(9, -6, a.isGiant?10:5, 0, Math.PI*2); ctx.fill();
                        ctx.restore();
                        break;

                    // ---------- 蹇緧锛氶緧鏃嬮ⅷ Dragon Rush ----------
                    case 'dragonite':
                        ctx.strokeStyle = '#FECC5B';
                        ctx.lineWidth = a.isGiant ? 8 : 5;
                        ctx.lineCap = 'round';
                        ctx.shadowColor = '#F6AD55'; ctx.shadowBlur = a.isGiant ? 30 : 15;
                        for (let i = 0; i < 3; i++) {
                            ctx.beginPath();
                            const ox = -i * 10, oy = Math.sin(i * 2 + t*4) * 8;
                            ctx.moveTo(x + ox, y + oy);
                            ctx.bezierCurveTo(x + ox - 15, y + oy - 15, x + ox - 25, y + oy + 10, x + ox - 35, y + oy);
                            ctx.stroke();
                        }
                        // 榫嶄箣鑳介噺鐞?
                        ctx.fillStyle = '#F6AD55';
                        ctx.beginPath(); ctx.arc(x - 30, y, a.isGiant?14:8, 0, Math.PI*2); ctx.fill();
                        break;

                    // ---------- 鍗℃瘮鐛革細閲嶈笍楂旀敾 Earthquake ----------
                    case 'snorlax':
                        // 闇囨尝
                        ctx.strokeStyle = '#9F7AEA';
                        ctx.lineWidth = 3;
                        for (let i = 0; i < 5; i++) {
                            const r = 10 + i * 12;
                            ctx.globalAlpha = Math.max(0, 1 - i / 5);
                            ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
                        }
                        ctx.globalAlpha = 1;
                        // 鐭抽牠椋涙亢
                        ctx.fillStyle = '#6B46C1';
                        for (let i = 0; i < (a.isGiant?8:5); i++) {
                            const sx = x - 10 - i*12 - Math.random()*8;
                            const sy = y - 5 + Math.sin(i*1.5)*10;
                            ctx.fillRect(sx, sy, a.isGiant?8:5, a.isGiant?6:4);
                        }
                        break;

                    // ---------- 璺崱鍒╂瓙锛氭尝灏庡綀 Aura Sphere ----------
                    case 'lucario':
                        ctx.save(); ctx.translate(x, y); ctx.rotate(t * Math.PI);
                        // 钘嶈壊鍏夌悆
                        var auraGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, a.isGiant?28:14);
                        auraGrad.addColorStop(0, '#fff');
                        auraGrad.addColorStop(0.3, '#63B3ED');
                        auraGrad.addColorStop(0.7, '#4299E1');
                        auraGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = auraGrad;
                        ctx.beginPath(); ctx.arc(0, 0, a.isGiant?28:14, 0, Math.PI*2); ctx.fill();
                        // 娉㈠皫杓诲皠绶?
                        ctx.strokeStyle = 'rgba(99,179,237,0.6)'; ctx.lineWidth = 2;
                        for (let i = 0; i < 8; i++) {
                            const a = (i / 8) * Math.PI * 2;
                            ctx.beginPath();
                            ctx.moveTo(Math.cos(a)*16, Math.sin(a)*16);
                            ctx.lineTo(Math.cos(a)*30, Math.sin(a)*30);
                            ctx.stroke();
                        }
                        ctx.restore();
                        break;

                    // ---------- 澶㈠够锛氬够璞″厜鐣拌兘 Psybeam ( rainbow) ----------
                    case 'mew':
                        ctx.save(); ctx.translate(x, y); ctx.rotate(t * Math.PI * 1.5);
                        const rainbowColors = ['#FC8181','#F6AD55','#68D391','#63B3ED','#9F7AEA'];
                        rainbowColors.forEach((c, i) => {
                            ctx.strokeStyle = c; ctx.lineWidth = a.isGiant?5:3;
                            ctx.beginPath();
                            ctx.arc(0, 0, 8 + i*7, (i/5)*Math.PI, (i/5+0.6)*Math.PI);
                            ctx.stroke();
                        });
                        ctx.restore();
                        // 鏄熷〉
                        ctx.fillStyle = '#FBB6CE';
                        for (let i = 0; i < 6; i++) {
                            const sx = x - 25 + i*10 + Math.sin(t*3+i)*5;
                            const sy = y + Math.cos(t*2+i*1.5)*8;
                            drawStar(ctx, sx, sy, 4, a.isGiant?6:3, a.isGiant?2:1);
                            ctx.fill();
                        }
                        break;

                    // ---------- 浼婂竷锛氬奖鍒嗚韩 Shadow Ball ----------
                    case 'eevee':
                        var shadowGrad = ctx.createRadialGradient(x-8, y, 0, x-8, y, a.isGiant?32:16);
                        shadowGrad.addColorStop(0, 'rgba(60,20,80,0.95)');
                        shadowGrad.addColorStop(0.5, 'rgba(80,30,100,0.8)');
                        shadowGrad.addColorStop(1, 'transparent');
                        ctx.fillStyle = shadowGrad;
                        ctx.beginPath(); ctx.arc(x - (a.isGiant?20:10), y, a.isGiant?32:16, 0, Math.PI*2); ctx.fill();
                        // 榛戣壊鏄熻姃
                        ctx.fillStyle = '#4A235A';
                        for (let i = 0; i < 5; i++) {
                            const sx = x - 5 - i*14 + Math.sin(i)*5;
                            const sy = y + Math.cos(i*2)*6;
                            drawStar(ctx, sx, sy, 5, a.isGiant?8:5, a.isGiant?3:2);
                            ctx.fill();
                        }
                        break;
                }
                if (a.isGiant) { ctx.restore(); } // end giant scale
                ctx.restore(); // end main save
                break;
            }
            case ANIM_TYPES.HIT: {
                const targetSide = a.side;
                const tx = (targetSide === 'right' ? canvasW * 0.78 : canvasW * 0.22) + 72;
                const ty = groundY - 72;
                var hitScale = a.isGiant ? 2.0 : 1.0;
                ctx.fillStyle = a.isGiant
                    ? `rgba(255,200,0,${(1-t)*0.8})`
                    : `rgba(255,0,0,${1-t})`;
                ctx.fillRect(tx - 30 * hitScale, ty - 30 * hitScale, 60 * hitScale, 60 * hitScale);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold ' + (a.isGiant ? 36 : 20) + 'px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText(a.isGiant ? '馃挜鈿? : '馃挜', tx, ty);
                if (a.isGiant) {
                    // Screen shake text
                    ctx.fillStyle = 'rgba(255,255,0,0.7)';
                    ctx.font = 'bold 18px "Orbitron", sans-serif';
                    ctx.fillText('DOUBLE!', tx, ty - 40 * hitScale);
                }
                break;
            }
            case ANIM_TYPES.FALL: {
                const sX = a.side === 'left' ? canvasW * 0.22 : canvasW * 0.78;
                ctx.save(); ctx.translate(sX + 72, groundY);
                ctx.rotate((a.side === 'left' ? 1 : -1) * t * Math.PI/2);
                const sprite = getBattleSprite(a.charKey);
                if (sprite) {
                    const h = charHeight(), w = h * sprite.naturalWidth / sprite.naturalHeight;
                    ctx.imageSmoothingEnabled = true;
                    ctx.drawImage(sprite, -w/2, -h - t*220, w, h);
                } else {
                    const ps = getCharacterCanvas(a.charKey || 'pikachu', a.level || 1);
                    ctx.imageSmoothingEnabled = false;
                    ctx.drawImage(ps.canvas, -72, -144 - t*200, 144, 144);
                }
                ctx.restore();
                break;
            }
            case ANIM_TYPES.LEVEL_UP: {
                const lX = (a.side === 'left' ? canvasW * 0.22 : canvasW * 0.78) + 72;
                const lY = groundY - 160;
                for (let i = 0; i < 15; i++) {
                    const pt = (t + i * 0.07) % 1;
                    const px = lX + Math.cos(i * 1.2) * 40 * pt;
                    const py = lY - pt * 100 + Math.sin(pt * Math.PI) * 20;
                    ctx.fillStyle = `rgba(255,215,0,${1-pt})`;
                    ctx.beginPath(); ctx.arc(px, py, 3, 0, Math.PI*2); ctx.fill();
                }
                ctx.fillStyle = '#ffd700'; ctx.font = 'bold 28px "Orbitron", sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('LEVEL UP!', lX, lY - 60);
                break;
            }
            case 'shieldBlock': {
                const sX = (a.side === 'left' ? canvasW * 0.22 : canvasW * 0.78) + 72;
                const sY = groundY - 72;
                const expand = t < 0.3 ? t / 0.3 : 1;
                const alpha = t > 0.6 ? (1 - (t - 0.6) / 0.4) : 1;
                ctx.save();
                ctx.strokeStyle = 'rgba(100, 200, 255, ' + alpha.toFixed(2) + ')';
                ctx.lineWidth = 4;
                const radius = 40 + expand * 60;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.ellipse(sX, sY + i * 15 - 15, radius, radius * 0.7, 0, 0, Math.PI * 2);
                    ctx.stroke();
                }
                ctx.fillStyle = 'rgba(255, 255, 255, ' + (alpha * 0.4).toFixed(2) + ')';
                ctx.font = 'bold 24px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('馃洝锔?BLOCKED!', sX, sY - radius - 20);
                ctx.restore();
                break;
            }
            case 'revive': {
                const rX = (a.side === 'left' ? canvasW * 0.22 : canvasW * 0.78) + 72;
                const rY = groundY - 100;
                ctx.save();
                for (let i = 0; i < 12; i++) {
                    const pt = (t + i * 0.08) % 1;
                    const angle = i * 0.9 + pt * Math.PI * 2;
                    const dist = pt * 50;
                    const px = rX + Math.cos(angle) * dist;
                    const py = rY - pt * 60 + Math.sin(pt * Math.PI) * 15;
                    ctx.fillStyle = 'rgba(74, 222, 128, ' + (1 - pt).toFixed(2) + ')';
                    ctx.beginPath(); ctx.arc(px, py, 3 + (1 - pt) * 3, 0, Math.PI * 2); ctx.fill();
                }
                ctx.fillStyle = 'rgba(74, 222, 128, ' + (1 - t).toFixed(2) + ')';
                ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
                ctx.fillText('馃挌 澶嶆椿!', rX, rY - 50);
                ctx.restore();
                break;
            }
            case ANIM_TYPES.KING_SLAYER: {
                // Big "寮戠帇鑰?King Slayer" text + explosion particles
                var cx = canvasW / 2;
                var cy = groundY - 100;
                // Scale pop: 0鈫?.2鈫?
                var scale = t < 0.15 ? t / 0.15 * 1.2 : 1.2 - (t - 0.15) / 0.85 * 0.2;
                if (t < 0.15) scale = t / 0.15 * 1.2;
                else scale = 1.2 - Math.min((t - 0.15) / 0.15, 1) * 0.2;
                var alpha = t > 0.8 ? 1 - (t - 0.8) / 0.2 : 1;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(cx, cy);
                ctx.scale(scale, scale);
                ctx.translate(-cx, -cy);
                // Background glow
                ctx.shadowColor = '#ffd700';
                ctx.shadowBlur = 40;
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 72px "Noto Sans SC", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('寮戠帇鑰?, cx, cy - 10);
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 20;
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 36px "Orbitron", sans-serif';
                ctx.fillText('King Slayer', cx, cy + 40);
                ctx.shadowBlur = 0;
                // Explosion particles
                for (var i = 0; i < 20; i++) {
                    var pt = Math.min(t * 1.5, 1);
                    var angle = i * 0.314 + t * 2;
                    var dist = pt * 120 + Math.sin(t * 10 + i) * 15;
                    var px = cx + Math.cos(angle) * dist;
                    var py = cy + Math.sin(angle) * dist;
                    var pAlpha = (1 - pt) * alpha;
                    ctx.fillStyle = 'rgba(255,215,0,' + pAlpha.toFixed(2) + ')';
                    ctx.beginPath(); ctx.arc(px, py, 3 + (1 - pt) * 4, 0, Math.PI * 2); ctx.fill();
                }
                ctx.restore();
                break;
            }
        }
    });

    // Draw static fallen sprites (persist after fall animation ends)
    function drawFallenSprite(charKey, side, dir) {
        const lX = side === 'left' ? canvasW * 0.22 : canvasW * 0.78;
        ctx.save(); ctx.translate(lX + 72, groundY);
        ctx.rotate(dir * Math.PI / 2); // fully rotated (90掳)
        const spr = getBattleSprite(charKey);
        if (spr) {
            const h = charHeight(), w = h * spr.naturalWidth / spr.naturalHeight;
            ctx.imageSmoothingEnabled = true;
            ctx.drawImage(spr, -w/2, -h - 220, w, h); // 鍊掑湴鍋忕Щ
        } else {
            const ps = getCharacterCanvas(charKey || 'pikachu', battleState.leftLevel || 1);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(ps.canvas, -72, -144 - 200, 144, 144);
        }
        ctx.restore();
    }
    if (leftFallen) drawFallenSprite(battleState.leftCharacter, 'left', 1);
    if (rightFallen) drawFallenSprite(battleState.rightCharacter, 'right', -1);
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
    let rot = Math.PI / 2 * 3, step = Math.PI / spikes;
    ctx.beginPath();
    for (let i = 0; i < spikes; i++) {
        ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
        rot += step;
        ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
        rot += step;
    }
    ctx.closePath();
}

// Shuffle options (Fisher-Yates, preserves ans index)
function shuffleOptions(scenesArr) {
    scenesArr.forEach(s => {
        const oldAns = s.ans;
        const pairs = s.options.map((opt, i) => ({ opt, i }));
        for (let i = pairs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
        }
        s.options = pairs.map(p => p.opt);
        s.ans = pairs.findIndex(p => p.i === oldAns);
    });
}

// Force balanced answer position distribution (deterministic)
function balanceAnswerDistribution(scenesArr) {
    var total = scenesArr.length;
    // Target count per position: distribute remainder to first N positions
    var baseTarget = Math.floor(total / 3);
    var remainder = total % 3; // 0, 1, or 2 extra slots
    var targets = [baseTarget, baseTarget, baseTarget];
    for (var r = 0; r < remainder; r++) targets[r]++;

    var counts = [0, 0, 0];
    scenesArr.forEach(function(s) { if (s.ans >= 0 && s.ans <= 2) counts[s.ans]++; });

    // Move answers from overrepresented to underrepresented positions
    for (var overPos = 0; overPos < 3; overPos++) {
        while (counts[overPos] > targets[overPos]) {
            // Find an underrepresented position
            var underPos = -1;
            for (var u = 0; u < 3; u++) {
                if (counts[u] < targets[u]) { underPos = u; break; }
            }
            if (underPos < 0) break;

            // Find a question with ans at the overrepresented position
            var qIdx = -1;
            for (var k = 0; k < scenesArr.length; k++) {
                if (scenesArr[k].ans === overPos) { qIdx = k; break; }
            }
            if (qIdx < 0) break;

            // Swap option text: move correct answer from overPos to underPos
            var s = scenesArr[qIdx];
            var temp = s.options[overPos];
            s.options[overPos] = s.options[underPos];
            s.options[underPos] = temp;
            s.ans = underPos;

            counts[overPos]--;
            counts[underPos]++;
        }
    }
}

function buildFallbackData(text, easyN, medN, hardN, totalQ) {
    const lines = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
    const questions = [];
    lines.forEach((line, idx) => {
        if (questions.length >= totalQ) return;
        const prefix = line.length > 15 ? line.slice(0, 15) : line;
        const diff = idx < easyN ? 'easy' : (idx < easyN + medN ? 'medium' : 'hard');
        const stars = { easy: '猸?, medium: '猸愨瓙猸?, hard: '猸愨瓙猸愨瓙猸? };
        questions.push({
            q: `鍏充簬"${prefix}鈥?鐨勫唴瀹癸紝鍝竴椤规渶鍑嗙‘锛焋,
            options: [
                line.length > 40 ? line.slice(0, 40) + '鈥? : line,
                `涓?${prefix}"鐩稿叧鐨勫叧閿蹇礰,
                `浠ヤ笅鍝」涓嶅睘浜庤鐭ヨ瘑鐐圭殑鑼冪暣锛焋
            ],
            ans: 0, note: `杩欓亾棰樺洿缁?${prefix}"璁捐銆?{line}`,
            title: `绗?{idx+1}棰榒, emoji: '馃摑', diff: stars[diff], difficulty: diff
        });
    });
    while (questions.length < totalQ) {
        questions.push({
            q: `绗?${questions.length+1} 棰橈細璇锋牴鎹祫鏂欏唴瀹瑰垽鏂璥,
            options: ['閫夐」 A', '閫夐」 B', '閫夐」 C'],
            ans: 1, note: '绂荤嚎妯″紡鐢熸垚鐨勫鐢ㄩ鐩€傝繛鎺?AI 鏈嶅姟鍙幏寰楁洿绮惧噯鐨勯鐩€?,
            title: '澶囩敤棰?, emoji: '馃', diff: '猸愨瓙猸?, difficulty: 'medium'
        });
    }
    return questions.slice(0, totalQ);
}

function initSkillSpinner() {
    var spinner = document.getElementById('skill-spinner');
    var n = SKILL_WHEEL_SLOTS.length;
    var arc = 360 / n;

    SKILL_WHEEL_SLOTS.forEach(function(k, i) {
        var c = SKILLS[k].color;
        gradParts.push(c + ' ' + (i * arc) + 'deg ' + ((i + 1) * arc) + 'deg');
    });
    spinner.style.background = 'conic-gradient(' + gradParts.join(', ') + ')';
    spinner.style.transform = 'rotate(0deg)';
    spinner.style.transition = 'none';

    // Draw segment labels
    var container = document.getElementById('skill-spinner-container');
    // Remove old labels
    container.querySelectorAll('.skill-segment-label').forEach(function(el) { el.remove(); });
    var r = 110; // label distance from center
    SKILL_WHEEL_SLOTS.forEach(function(k, i) {
        var midAngle = (i * arc + arc / 2) * Math.PI / 180;
        var lx = 150 + Math.cos(midAngle) * r;
        var ly = 150 + Math.sin(midAngle) * r;
        var label = document.createElement('div');
        label.className = 'skill-segment-label';
        label.style.left = lx + 'px';
        label.style.top = ly + 'px';
        label.style.transform = 'translate(-50%, -50%) rotate(' + (midAngle * 180 / Math.PI) + 'deg)';

}

function spinSkillWheel() {
    if (skillWheelState.isSpinning) return;
    skillWheelState.isSpinning = true;
    document.getElementById('skill-spin-btn').disabled = true;
    document.getElementById('skill-result-display').classList.add('hidden');

    var spins = 5 + Math.random() * 3; // 5-8 full rotations
    var extraAngle = Math.random() * 360;
    var totalAngle = spins * 360 + extraAngle;
    var spinner = document.getElementById('skill-spinner');

    // Animate with rAF for tick sound
    var startAngle = 0;
    var duration = 3500;
    var startTime = null;
    var lastTick = 0;

    function animate(time) {
        if (!startTime) startTime = time;
        var progress = Math.min((time - startTime) / duration, 1);
        // Ease out cubic
        var eased = 1 - Math.pow(1 - progress, 3);
        var currentAngle = eased * totalAngle;
        spinner.style.transition = 'none';
        spinner.style.transform = 'rotate(' + currentAngle + 'deg)';

        if (Math.floor(currentAngle / 30) > lastTick) {
            playWheelTick();
            lastTick = Math.floor(currentAngle / 30);
        }

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            // Determine result
            var finalAngle = totalAngle % 360;
            var arc = 360 / SKILL_WHEEL_SLOTS.length;
            var idx = Math.floor(((360 - finalAngle) % 360) / arc) % SKILL_WHEEL_SLOTS.length;
            var chosenKey = SKILL_WHEEL_SLOTS[idx];
            skillWheelState.targetSkill = chosenKey;
            skillWheelState.isSpinning = false;
            document.getElementById('skill-spin-btn').classList.add('hidden');
            document.getElementById('skill-close-btn').classList.remove('hidden');

            var skill = SKILLS[chosenKey];

let wheelState = { startAngle: 0, spinCount: 0, firstStudent: null, secondStudent: null, isSpinning: false, excludeStudent: null, lastSpunName: null };
let wheelTimeout = null;
let charSelectState = { pickingFor: 'left', leftPick: null, rightPick: null, singlePick: false };

function getWheelCandidateNames() {
    var names = Object.keys(students).filter(function(n) { return !students[n].eliminated; });
    if (wheelState.excludeStudent) {
        var filtered = names.filter(function(n) { return n !== wheelState.excludeStudent; });
        if (filtered.length >= 1) names = filtered;
    }
    return names;
}

function initWheel(availableNames) {
    const canvas = document.getElementById('wheelCanvas'), ctx = canvas.getContext('2d');
    if (!canvas || !ctx) return;
    const num = availableNames.length;
    if (num === 0) return;
    const arc = (2 * Math.PI) / num;
    const colors = ['#ff9ebb','#a0d8ef','#fbbf24','#3b82f6','#8b5cf6','#f472b6','#fb923c','#34d399','#f87171','#60a5fa'];
    ctx.clearRect(0, 0, 600, 600);
    for (let i = 0; i < num; i++) {
        const angle = wheelState.startAngle + i * arc;
        ctx.beginPath(); ctx.moveTo(300, 300); ctx.arc(300, 300, 280, angle, angle + arc);
        ctx.fillStyle = colors[i % colors.length]; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.save(); ctx.translate(300, 300); ctx.rotate(angle + arc / 2);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 28px "Noto Sans SC"'; ctx.textAlign = 'right';
        ctx.fillText(availableNames[i], 270, 10); ctx.restore();
    }
}

// 鎶界鎸夐挳閿佸畾/瑙ｉ攣锛氭娊绛惧悗鍙樼伆閿佸畾锛岀洿鍒拌€佸笀鐐广€岀‘璁ゅ嚭鎴樸€嶆垨銆岀己甯烦杩囥€嶆墠瑙ｉ攣
function setSpinBtnEnabled(en) {
    var btn = document.getElementById('spin-btn');
    if (!btn) return;
    btn.disabled = !en;
    btn.style.opacity = en ? '1' : '0.4';
    btn.style.cursor = en ? 'pointer' : 'not-allowed';
    btn.style.pointerEvents = en ? 'auto' : 'none';
}

function spinWheel() {
    if (wheelState.isSpinning) return;
    wheelState.isSpinning = true;
    setSpinBtnEnabled(false);
    document.getElementById('wheel-result').classList.add('hidden');
    document.getElementById('wheel-result-actions').classList.add('hidden');
    document.getElementById('confirm-student-btn').classList.add('hidden');
    document.getElementById('skip-student-btn').classList.add('hidden');
    clearTimeout(wheelTimeout);

    var wheelCandidates = getWheelCandidateNames();
    if (wheelCandidates.length === 0) {
        wheelState.isSpinning = false;
        document.getElementById('spin-btn').disabled = false;
        document.getElementById('wheel-label').innerText = '鈿狅笍 娌℃湁鍙娊閫夌殑瀛︾敓浜?;
        document.getElementById('spin-btn').classList.add('hidden');
        return;
    }

    const speed = 0.4 + Math.random() * 0.5, duration = 3500;
    let start = null, lastTick = 0;
    function animate(time) {
        if (!start) start = time;
        const progress = (time - start) / duration;
        if (progress < 1) {
            wheelState.startAngle += speed * (1 - progress);
            if (wheelState.startAngle - lastTick > 0.08) { playWheelTick(); lastTick = wheelState.startAngle; }
            const avail = getWheelCandidateNames();
            initWheel(avail);
            requestAnimationFrame(animate);
        } else {
            const avail = getWheelCandidateNames();
            const arc = (2 * Math.PI) / avail.length;
            const idx = Math.floor((1.5 * Math.PI - (wheelState.startAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / arc) % avail.length;
            const chosen = avail[idx];
            wheelState.isSpinning = false;
            // 鎶界缁撴潫淇濇寔閿佸畾锛堝彉鐏帮級锛岀洿鍒拌€佸笀鐐广€岀‘璁ゅ嚭鎴?缂哄腑璺宠繃銆嶅啀瑙ｉ攣锛岄槻姝㈣瑙﹀啀鎶藉鑷村尮閰嶉敊涔?
            setSpinBtnEnabled(false);
            document.getElementById('wheel-result-actions').classList.remove('hidden');
            document.getElementById('wheel-result').classList.remove('hidden');
            document.getElementById('wheel-result-name').innerText = chosen;
            wheelState.lastSpunName = chosen;
            onWheelComplete(chosen);
        }
    }
    requestAnimationFrame(animate);
}

function initGroupWheel() {
    var canvas = document.getElementById('wheelCanvas'), ctx = canvas.getContext('2d');
    if (!canvas || !ctx) return;
    var groupNames = groupQueue.map(function(idx) { return groups[idx].name; });
    var num = groupNames.length;
    if (num === 0) return;
    var arc = (2 * Math.PI) / num;
    var colors = ['#c084fc','#a78bfa','#8b5cf6','#7c3aed','#6d28d9','#5b21b6','#4c1d95','#8b5cf6','#c084fc','#a78bfa'];
    ctx.clearRect(0, 0, 600, 600);
    for (var i = 0; i < num; i++) {
        var angle = wheelState.startAngle + i * arc;
        ctx.beginPath(); ctx.moveTo(300, 300); ctx.arc(300, 300, 280, angle, angle + arc);
        ctx.fillStyle = colors[i % colors.length]; ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
        ctx.save(); ctx.translate(300, 300); ctx.rotate(angle + arc / 2);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 24px "Noto Sans SC"'; ctx.textAlign = 'right';
        ctx.fillText(groupNames[i], 270, 10); ctx.restore();
    }
}

function spinGroupWheel() {
    if (wheelState.isSpinning) return;
    if (groupQueue.length === 0) return;
    wheelState.isSpinning = true;
    document.getElementById('spin-btn').disabled = true;
    document.getElementById('wheel-result').classList.add('hidden');
    document.getElementById('wheel-result-actions').classList.add('hidden');
    clearTimeout(wheelTimeout);

    var speed = 0.3 + Math.random() * 0.4, duration = 3000;
    var start = null, lastTick = 0;

    // Winner stays: queue only has waiting groups. Always pick queue[0].
    var targetQueueIdx = 0;
    var targetGroupIdx = groupQueue[targetQueueIdx];
    var groupNames = groupQueue.map(function(idx) { return groups[idx].name; });
    var targetArc = (2 * Math.PI) / groupNames.length;
    var targetIdxInNames = groupQueue.indexOf(targetGroupIdx);
    // Calculate the angle needed so the pointer lands on the target
    var targetCenterAngle = targetIdxInNames * targetArc + targetArc / 2;
    var pointerAngle = 1.5 * Math.PI; // top of wheel
    var neededAngle = pointerAngle - targetCenterAngle;
    // Add multiple full rotations for excitement
    var totalExtra = 6 * 2 * Math.PI + neededAngle;
    var startAngle = wheelState.startAngle;
    var targetStartAngle = startAngle + totalExtra;

    function animate(time) {
        if (!start) start = time;
        var progress = Math.min((time - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        wheelState.startAngle = startAngle + totalExtra * eased;
        if (wheelState.startAngle - lastTick > 0.08) { playWheelTick(); lastTick = wheelState.startAngle; }
        initGroupWheel();
        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            wheelState.startAngle = targetStartAngle;
            wheelState.isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            onGroupWheelComplete(targetGroupIdx);
        }
    }
    requestAnimationFrame(animate);
}

function onGroupWheelComplete(groupIdx) {
    playCorrectSound();
    var groupName = groups[groupIdx].name;

    // Remove selected group from queue (it's now "active" in the arena)
    groupQueue = groupQueue.filter(function(qid) { return qid !== groupIdx; });

    var ph = groupWheelState.phase;

    if (ph === 'leftGroup' || ph === 'leftReplacement') {
        groupWheelState.leftGroupIdx = groupIdx;
        document.getElementById('wheel-label').innerText = '宸︽柟缁勫埆锛? + groupName + ' 鉁?;

        groupWheelState.phase = 'leftPlayer';
    } else if (ph === 'rightGroup' || ph === 'rightReplacement') {
        groupWheelState.rightGroupIdx = groupIdx;
        document.getElementById('wheel-label').innerText = '鍙虫柟缁勫埆锛? + groupName + ' 鉁?;
        document.getElementById('spin-btn').classList.add('hidden');
        renderGroupPlayerList(groupIdx, 'right');
        groupWheelState.phase = 'rightPlayer';

}

function confirmGroupPlayer() {
    if (groupWheelState.selectedPlayerIdx === null) return;
    var groupIdx, playerName, side;
    if (groupWheelState.phase === 'leftPlayer') {
        groupIdx = groupWheelState.leftGroupIdx;
        side = 'left';
    } else {
        groupIdx = groupWheelState.rightGroupIdx;
        side = 'right';
    }

    playerName = groups[groupIdx].players[groupWheelState.selectedPlayerIdx].name;

    // Initialize student tracking
    if (!students[playerName]) {
        students[playerName] = { name: playerName, wins: 0, losses: 0, streak: 0, bestStreak: 0, character: null, level: 1, eliminated: false, usedCount: 1, totalQuestions: 0, correctAnswers: 0 };

        students[playerName].usedCount = (students[playerName].usedCount || 0) + 1;
    }
    markStudentPicked(playerName);
    students[playerName].eliminated = false; // Reset for re-entering players

    if (side === 'left') {
        groupWheelState.leftPlayer = playerName;
        battleState.leftStudent = playerName;
        // Restore character/level if player has played before
        if (students[playerName].character) {

        groupWheelState.rightPlayer = playerName;

}

// ============ GROUP BATTLE PROCEED ============

function groupProceedAfterRound() {
    document.getElementById('battle-note').classList.add('hidden');
    battleState.questionIndex++;

    if (battleState.questionIndex >= scenes.length) {
        stopRenderLoop();
        document.getElementById('battle-view').classList.add('hidden');
        showGroupLeaderboard();
        return;
    }

    var leftName = battleState.leftStudent, rightName = battleState.rightStudent;
    var leftAlive = students[leftName] && !students[leftName].eliminated;
    var rightAlive = students[rightName] && !students[rightName].eliminated;

    // Update group alive counts and queue (remove fully dead groups)
    updateGroupElimination();

    stopRenderLoop();

    // Restore winner's character/level from tracking
    if (students[leftName]) {
        battleState.leftCharacter = students[leftName].character || battleState.leftCharacter;
        battleState.leftLevel = students[leftName].level || 1;
    }
    if (students[rightName]) {
        battleState.rightCharacter = students[rightName].character || battleState.rightCharacter;
        battleState.rightLevel = students[rightName].level || 1;
    }

    // Shield block: both survive 鈫?rematch with same players
    if (leftAlive && rightAlive && battleState.shieldBlocked) {
        battleState.shieldBlocked = false;
        var aliveGroupCountSB = 0;
        groups.forEach(function(g) { if (g.aliveCount > 0) aliveGroupCountSB++; });
        if (aliveGroupCountSB <= 1) {
            document.getElementById('battle-view').classList.add('hidden');
            showGroupLeaderboard();
            return;
        }
        // Both stay active, no queue changes needed
        groupWheelState.phase = 'done'; groupWheelState.replacementSide = null;
        document.getElementById('battle-view').classList.add('hidden');
        showVSCountdown();
        return;
    }

    var leftGid = groupWheelState.leftGroupIdx;
    var rightGid = groupWheelState.rightGroupIdx;

    // WINNER STAYS: loser's group 鈫?back of queue. Winner stays active.
    // New challenger comes from front of queue.

    if (leftAlive && !rightAlive) {
        // Left won 鈫?push right (loser) to back of queue
        if (rightGid !== null && rightGid !== undefined && groups[rightGid] && groups[rightGid].aliveCount > 0) {
            groupQueue.push(rightGid);
        }
        groupWheelState = {
            phase: 'rightReplacement',
            leftGroupIdx: leftGid, leftPlayer: leftName,
            rightGroupIdx: null, rightPlayer: null,
            isSpinning: false, selectedPlayerIdx: null,
            replacementSide: 'right'
        };
        battleState.leftStudent = leftName;
        battleState.leftCharacter = students[leftName] ? (students[leftName].character || battleState.leftCharacter) : battleState.leftCharacter;
        battleState.leftLevel = students[leftName] ? (students[leftName].level || 1) : battleState.leftLevel;

    } else if (!leftAlive && rightAlive) {
        // Right won 鈫?push left (loser) to back of queue
        if (leftGid !== null && leftGid !== undefined && groups[leftGid] && groups[leftGid].aliveCount > 0) {
            groupQueue.push(leftGid);
        }
        groupWheelState = {
            phase: 'leftReplacement',
            leftGroupIdx: null, leftPlayer: null,
            rightGroupIdx: rightGid, rightPlayer: rightName,
            isSpinning: false, selectedPlayerIdx: null,
            replacementSide: 'left'
        };
        battleState.rightStudent = rightName;
        battleState.rightCharacter = students[rightName] ? (students[rightName].character || battleState.rightCharacter) : battleState.rightCharacter;
        battleState.rightLevel = students[rightName] ? (students[rightName].level || 1) : battleState.rightLevel;

    } else {
        // Both lost 鈫?push both to back of queue
        if (leftGid !== null && leftGid !== undefined && groups[leftGid] && groups[leftGid].aliveCount > 0) {
            groupQueue.push(leftGid);
        }
        if (rightGid !== null && rightGid !== undefined && groups[rightGid] && groups[rightGid].aliveCount > 0) {
            groupQueue.push(rightGid);
        }
        groupWheelState = {
            phase: 'leftGroup',
            leftGroupIdx: null, leftPlayer: null,
            rightGroupIdx: null, rightPlayer: null,
            isSpinning: false, selectedPlayerIdx: null,
            replacementSide: null
        };
    }

    // Check end condition: count ALL groups (active + waiting) with alive players
    var aliveGroupCount = 0;
    groups.forEach(function(g) { if (g.aliveCount > 0) aliveGroupCount++; });
    if (aliveGroupCount <= 1) {
        stopRenderLoop();
        document.getElementById('battle-view').classList.add('hidden');
        showGroupLeaderboard();
        return;
    }

    // Need at least one group in queue to pick a challenger
    if (groupWheelState.phase !== 'leftGroup' && groupQueue.length === 0) {
        stopRenderLoop();
        document.getElementById('battle-view').classList.add('hidden');
        showGroupLeaderboard();
        return;
    }
    if (groupWheelState.phase === 'leftGroup' && groupQueue.length < 2) {
        stopRenderLoop();
        document.getElementById('battle-view').classList.add('hidden');
        showGroupLeaderboard();
        return;
    }

    // 澶╀笅鍏晫澶辨晥妫€鏌ワ細鐜嬭€呮湰浜哄凡琚窐姹帮紙濡傚弻鏂硅秴鏃堕兘绠楄緭锛夆啋 瑙ｉ櫎
    if (publicEnemyState.active && students[publicEnemyState.kingPlayer] && students[publicEnemyState.kingPlayer].eliminated) {
        publicEnemyState.active = false;
        publicEnemyState.kingGroupIdx = null;
        publicEnemyState.kingPlayer = null;
        publicEnemyState.kingStreak = 0;
    }

    if (publicEnemyState.active) {
        // 澶╀笅鍏晫鐢熸晥锛氳烦杩囪疆鐩橈紝杩涘叆銆岃皝鎰挎寫鎴樼帇鑰咃紵銆嶆姤鍚嶅埗
        showPublicEnemySignup();
    } else {
        startGroupWheelPhase();
    }
}

function updateGroupElimination() {
    // Check ALL groups, not just active ones 鈥?queue groups may have stale aliveCount
    for (var gid = 0; gid < groups.length; gid++) {
        var g = groups[gid];
        if (!g) continue;
        var alive = 0;
        for (var pi = 0; pi < g.players.length; pi++) {
            var p = g.players[pi];
            // Sync from students tracking (authoritative source)
            if (students[p.name] && students[p.name].eliminated) {
                p.eliminated = true;
            }
            if (!p.eliminated) alive++;
        }
        g.aliveCount = alive;
        if (alive === 0) {
            // Remove dead group from waiting queue
            groupQueue = groupQueue.filter(function(qid) { return qid !== gid; });
        }
    }
}

function showGroupLeaderboard() {
    stopRenderLoop();
    document.getElementById('battle-view').classList.add('hidden');

    // Sort groups by totalWins desc, then aliveCount desc
    var sortedGroups = groups.slice().sort(function(a, b) {
        if (b.totalWins !== a.totalWins) return b.totalWins - a.totalWins;
        return b.aliveCount - a.aliveCount;
    });

    var html = '<h2 class="text-5xl font-black mb-6 text-center" style="color:#c084fc">馃弳 缁勫埆瀵瑰喅 路 鏈€缁堟帓鍚?/h2>';
    html += '<div class="glass-panel p-8 space-y-6 max-w-4xl mx-auto">';

    sortedGroups.forEach(function(g, rank) {
        var medal = rank === 0 ? '馃' : (rank === 1 ? '馃' : (rank === 2 ? '馃' : ''));
        var isChampion = g.aliveCount > 0 && rank === 0;
        html += '<div class="p-6 rounded-2xl" style="background:' + (isChampion ? 'rgba(251,191,36,0.15)' : 'rgba(255,255,255,0.05)') + ';border:2px solid ' + (isChampion ? '#fbbf24' : 'rgba(255,255,255,0.1)') + ';">';
        html += '<div class="flex items-center justify-between">';
        html += '<div><span class="text-3xl mr-3">' + medal + '</span><span class="text-3xl font-black">' + escHTML(g.name) + '</span>';
        if (isChampion) html += ' <span class="text-2xl ml-3">馃憫 鍐犲啗缁勶紒</span>';
        html += '</div>';
        html += '<div class="text-right">';
        html += '<span class="text-3xl font-black text-yellow-400">馃弳 ' + (g.totalWins || 0) + ' 鍒?/span>';
        html += '<div class="text-lg opacity-60">' + g.aliveCount + ' 浜哄瓨娲?/ ' + g.players.length + '</div>';
        html += '</div></div>';
        html += '<div class="mt-3 flex flex-wrap gap-2">';
        g.players.forEach(function(p) {
            var pStudent = students[p.name] || p;
            var pElim = p.eliminated || (pStudent && pStudent.eliminated);
            html += '<span class="px-3 py-1 rounded-full text-sm font-bold" style="background:' + (pElim ? 'rgba(239,68,68,0.2)' : 'rgba(34,197,94,0.2)') + ';color:' + (pElim ? '#fca5a5' : '#86efac') + ';">' + escHTML(p.name) + (pElim ? ' 鉂? : ' 鉁?) + '</span>';
        });
        html += '</div></div>';
    });

    html += '<div class="text-center mt-8"><button onclick="location.reload()" class="bg-purple-600 text-white font-black px-12 py-6 rounded-2xl shadow-xl text-2xl hover:scale-105 transition-transform border-4 border-purple-400">馃攧 杩斿洖涓婚〉</button></div>';
    html += '</div>';

    lb.innerHTML = html;
}

        roleEl.innerText = h.role + ' 路 ' + (h.gender === '濂? ? '濂? : h.gender === '涓€? ? '鉂? : '鐢?);
        lineEl.innerText = h.introLine;
        video.style.display = 'none'; portrait.style.display = 'none';
        portrait.src = h.portrait; portrait.style.display = 'block';
        setTimeout(done, 2200);
    }

    let idx = 0;
    function next() {
        if (idx < seq.length) { showHero(seq[idx], () => { idx++; next(); }); }
        else {
            view.classList.add('hidden');
            video.pause(); video.removeAttribute('src'); video.load();
            showVSCountdown();
        }
    }
    next();
}

function showVSCountdown() {
    const overlay = document.getElementById('vs-overlay');
    const text = document.getElementById('vs-text');
    overlay.classList.remove('hidden');
    const leftName = battleState.leftStudent, rightName = battleState.rightStudent;

    const rightChar = (HEROES[battleState.rightCharacter] || {}).emoji || '';

    [3, 2, 1].forEach((n, i) => {

            text.innerText = n; text.style.color = n === 1 ? '#ef4444' : '#fbbf24';

    });

        text.innerText = 'FIGHT!';
        text.style.color = '#ef4444';

        overlay.classList.add('hidden');
        text.style.fontSize = '8rem';
